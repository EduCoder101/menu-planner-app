var _shop = null;
function closeShoppingList() {
  if (!_shop) return;
  var fromNav = _shop.fromNav;
  document.removeEventListener('keydown', _shop.key, true);
  _shop.backdrop.remove();
  _shop = null;
  // Opened as a destination from the nav, so closing it should leave the URL on a
  // real view — otherwise the hash still says #/shopping with nothing shown.
  if (fromNav && location.hash.indexOf('shopping') !== -1) location.hash = '#/overview';
}

// The modal has three tabs: the list by aisle (how you shop), the same items by
// meal (what a given day needs), and the cupboard staples you can re-buy.
//
// opts.fromNav marks the copy opened from the Shopping nav tab, which returns to
// the overview on close so the back gesture lands somewhere sensible.
function openShoppingList(startWeek, opts) {
  closeShoppingList();
  opts = opts || {};
  // Mutable: the ◂ ▸ switcher moves between weeks without reopening the modal.
  var weekStart = startWeek;
  var backdrop = el('div', { 'class': 'modal-backdrop' },
    '<div class="modal shop-modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' +
        '<h3 class="modal-title"><svg class="i"><use href="#ic-cart"/></svg> Shopping list</h3>' +
        '<button class="modal-x ghost" data-act="close" title="Close">×</button>' +
      '</div>' +
      '<div class="shop-weeknav">' +
        '<button type="button" class="ghost" data-act="prevWeek" title="Previous week"><svg class="i"><use href="#ic-chev-l"/></svg></button>' +
        '<span data-bind="weekLabel"></span>' +
        '<button type="button" class="ghost" data-act="nextWeek" title="Next week"><svg class="i"><use href="#ic-chev-r"/></svg></button>' +
      '</div>' +
      '<div class="shop-tabs" role="tablist">' +
        '<button type="button" class="shop-tab on" data-tab="aisle">By aisle</button>' +
        '<button type="button" class="shop-tab" data-tab="meal">By meal</button>' +
        '<button type="button" class="shop-tab" data-tab="pantry">Cupboard</button>' +
      '</div>' +
      '<div data-bind="body"></div>' +
      '<div class="row modal-foot shop-foot">' +
        '<button type="button" class="ghost" data-act="share" title="Share or copy the list"><svg class="i"><use href="#ic-share"/></svg> Send</button>' +
        '<button type="button" class="ghost" data-act="email" title="Email the list"><svg class="i"><use href="#ic-mail"/></svg> Email</button>' +
        '<button type="button" class="ghost" data-act="clear">Uncheck all</button>' +
        '<button type="button" class="primary" data-act="close">Done</button>' +
      '</div>' +
    '</div>');
  document.body.appendChild(backdrop);
  var host = bind(backdrop, 'body');
  var weekLabel = bind(backdrop, 'weekLabel');

  var LIST = null;        // the last payload from the server
  var ITEMS = {};         // itemKey -> item
  var tab = 'aisle';
  var loadErr = null;     // a failed fetch, shown in-body when there is nothing to show

  function syncWeekLabel() {
    weekLabel.textContent = 'Week of ' + fmtWeek(weekStart) +
      (weekStart === thisMonday() ? ' · this week' : '');
  }

  function indexItems(list) {
    ITEMS = {};
    list.items.forEach(function (item) { ITEMS[item.itemKey] = item; });
  }

  function itemLi(item, mealsByKey) {
    if (!item) return '';
    var why = item.sources && item.sources.length
      ? '<span class="shop-why">' + esc(item.sources.join(', ')) + '</span>' : '';
    var ms = (mealsByKey && mealsByKey[item.itemKey]) || [];
    return '<li class="shop-item' + (item.checked ? ' checked' : '') + '" data-key="' + esc(item.itemKey) +
      '" data-meals="' + esc(ms.join(' ')) + '">' +
      '<label><input type="checkbox"' + (item.checked ? ' checked' : '') + '>' +
        '<span class="shop-label">' + esc(item.label) + '</span>' + why +
      '</label></li>';
  }

  function renderAisles() {
    var body = '';
    // Same tap-a-meal-to-light-it-up as the list under the plan. It matters more
    // here, if anything: this is the one you're holding in the shop.
    var mealsByKey = itemMealMap(LIST);
    body += liveMealsHtml(shopMeals(LIST));
    LIST.aisles.forEach(function (group) {
      body += '<div class="shop-group">' +
        '<div class="shop-group-head">' + esc(group.aisle) + '</div>' +
        '<ul class="shop-items">' +
          group.itemKeys.map(function (k) { return itemLi(ITEMS[k], mealsByKey); }).join('') +
        '</ul></div>';
    });
    if (LIST.pantry.length) {
      body += '<div class="shop-group">' +
        '<div class="shop-group-head">Cupboard re-buys</div>' +
        '<ul class="shop-items">' +
          LIST.pantry.map(function (p) { return itemLi(ITEMS[p.itemKey], mealsByKey); }).join('') +
        '</ul></div>';
    }
    // What the week's cooking assumes is already in. Listed, not bought — the
    // point is that you can see the assumption and correct it if it's wrong.
    if (LIST.checkPantry && LIST.checkPantry.length) {
      body += '<div class="live-check"><h4>Check the cupboard</h4><p>' +
        LIST.checkPantry.map(function (i) { return esc(i.label); }).join(' &middot; ') +
        '</p></div>';
    }
    if (!body) {
      body = '<p class="muted">Nothing to shop for yet — plan some meals, then give them ' +
        'ingredients — tap a planned meal, then photograph a recipe, read one from a URL, ' +
        'or draft one.</p>';
    }
    return body + missingNote();
  }

  function renderMeals() {
    if (!LIST.meals.length) return '<p class="muted">No planned meals with ingredients this week.</p>' + missingNote();
    return LIST.meals.map(function (g) {
      var roleTag = g.role === 'adult' ? ' · Adults' : g.role === 'kids' ? ' · Kids' : '';
      var chosen = g.chosen && g.chosen.length
        ? '<span class="shop-why">' + esc(g.chosen.join(', ')) + '</span>' : '';
      return '<div class="shop-group">' +
        '<div class="shop-group-head">' + DOW[g.dayIndex] + ' · ' + esc(g.mealName) + roleTag + chosen + '</div>' +
        '<ul class="shop-items">' +
          g.itemKeys.map(function (k) { return itemLi(ITEMS[k]); }).join('') +
        '</ul></div>';
    }).join('') + missingNote();
  }

  // Staples live outside the week: this tab is a library you maintain, and the
  // "Ran out" button is what puts one onto the current week's list.
  function renderPantry() {
    var rows = (STATE.pantry || []).map(function (p) {
      return '<li class="pantry-row' + (p.needed ? ' needed' : '') + '" data-pantry="' + esc(p.pantryId) + '">' +
        '<span class="pantry-name">' + esc(p.name) + '</span>' +
        '<span class="pantry-aisle muted">' + esc(p.aisle) + '</span>' +
        '<button type="button" class="ghost pantry-buy" data-pact="' + (p.needed ? 'unneed' : 'need') + '">' +
          (p.needed ? '✓ On the list' : 'Ran out') +
        '</button>' +
        '<button type="button" class="ghost pantry-x" data-pact="remove" title="Stop treating this as a staple">×</button>' +
      '</li>';
    }).join('');
    return '<p class="muted" style="font-size:.8rem">Staples are kept off the weekly list — ' +
      'they live in the cupboard. Tap <strong>Ran out</strong> and one joins this week\'s shop.</p>' +
      '<ul class="pantry-list">' + rows + '</ul>' +
      '<div class="row" style="gap:.4rem; flex-wrap:nowrap; margin-top:.5rem">' +
        '<input type="text" data-bind="newStaple" placeholder="Add a staple…" style="flex:1">' +
        '<button type="button" class="primary" data-act="addStaple">Add</button>' +
      '</div>';
  }

  // Meals planned this week that would contribute nothing — the most useful nudge
  // we can give, since an empty-looking list is nearly always this.
  function missingNote() {
    if (!LIST.missing.length) return '';
    return '<div class="shop-missing">' +
      '<strong>No ingredients saved yet:</strong> ' +
      LIST.missing.map(function (m) {
        return '<button type="button" class="link-btn" data-fill="' + esc(m.mealId) + '">' +
          DOW[m.dayIndex] + ' · ' + esc(m.mealName) + '</button>';
      }).join(', ') +
      '<div class="muted" style="font-size:.78rem; margin-top:.3rem">' +
        'Tap one to add its ingredients — scan a photo, paste a recipe URL, or ' +
        (LIST.hasAi ? 'let AI draft one.' : 'type them in.') +
      '</div></div>';
  }

  function render() {
    qsa('.shop-tab', backdrop).forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === tab);
    });
    // Sending is about what's left to buy, so it's meaningless on the cupboard tab.
    qsa('[data-act="share"], [data-act="email"], [data-act="clear"]', backdrop).forEach(function (b) {
      b.classList.toggle('hidden', tab === 'pantry');
    });
    if (tab === 'pantry') { host.innerHTML = renderPantry(); return; }
    if (!LIST) {
      host.innerHTML = loadErr
        ? '<p class="muted">Could not load the list — ' + esc(loadErr) + '</p>' +
          '<button type="button" class="ghost" data-act="retry">Try again</button>'
        : '<p class="muted">Working it out…</p>';
      return;
    }
    host.innerHTML = tab === 'meal' ? renderMeals() : renderAisles();
  }

  function seedFromCache() {
    LIST = SHOP_CACHE[weekStart] || null;
    ITEMS = {};
    if (LIST) indexItems(LIST);
  }

  // Paints whatever is known right away (cached list, or a working state),
  // then refreshes quietly — the in-body states replace the full-screen
  // spinner, which used to leave the sheet blank for the whole round-trip.
  function reload() {
    syncWeekLabel();
    loadErr = null;
    render();
    return callQuiet('getShoppingList', weekStart).then(function (list) {
      SHOP_CACHE[weekStart] = list;
      LIST = list;
      indexItems(list);
      render();
    }).catch(function (e) {
      loadErr = errMsg(e);
      if (LIST) toast(loadErr, true); else render();
    });
  }

  // Shopping runs ahead of the week you're in, so moving weeks has to be right
  // here rather than back out through the planner. Deliberately doesn't touch the
  // URL: that would re-enter the router, rebuild the modal, and lose your tab.
  function goWeek(delta) {
    weekStart = shiftIso(weekStart, delta * 7);
    seedFromCache();
    reload();
  }

  function loadPantry() {
    if (STATE.pantry) return Promise.resolve(STATE.pantry);
    return call('getPantry').then(function (p) { STATE.pantry = p; return p; });
  }

  seedFromCache();
  reload();

  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) { closeShoppingList(); return; }

    var mchip = e.target.closest('[data-livemeal]');
    if (mchip) {
      highlightShopMeal(qs('.shop-modal', backdrop), mchip.getAttribute('data-livemeal'));
      return;
    }

    var tabBtn = e.target.closest('.shop-tab');
    if (tabBtn) {
      tab = tabBtn.getAttribute('data-tab');
      if (tab === 'pantry') loadPantry().then(render).catch(function (err) { toast(errMsg(err), true); });
      else render();
      return;
    }

    // Jump straight from "no ingredients saved" to the editor for that meal.
    var fill = e.target.closest('[data-fill]');
    if (fill) {
      var mealId = fill.getAttribute('data-fill');
      closeShoppingList();
      // Deferred by a tick: closing a nav-opened list changes the hash, and the
      // resulting hashchange runs the router, which closes any open meal editor.
      // Opening on the next task puts us after that, not before it.
      setTimeout(function () { openMealCard(null, { mealId: mealId }); }, 0);
      return;
    }

    var pantryRow = e.target.closest('[data-pantry]');
    var pact = e.target.getAttribute('data-pact');
    if (pantryRow && pact) {
      var pantryId = pantryRow.getAttribute('data-pantry');
      var op = pact === 'remove'
        ? call('removePantryItem', pantryId).then(function () { return call('getPantry'); })
        : call('setPantryNeeded', pantryId, pact === 'need', weekStart);
      op.then(function (pantry) {
        STATE.pantry = pantry;
        render();
        return reload();  // the weekly list gains/loses the staple
      }).catch(function (err) { toast(errMsg(err), true); });
      return;
    }

    var act = e.target.getAttribute('data-act');
    if (act === 'close') { closeShoppingList(); return; }
    if (act === 'retry') { reload(); return; }
    if (act === 'prevWeek') { goWeek(-1); return; }
    if (act === 'nextWeek') { goWeek(1); return; }

    if (act === 'addStaple') {
      var input = bind(backdrop, 'newStaple');
      var name = (input.value || '').trim();
      if (!name) return;
      call('addPantryItem', name).then(function () { return call('getPantry'); })
        .then(function (pantry) {
          STATE.pantry = pantry;
          render();
          return reload();
        }).catch(function (err) { toast(errMsg(err), true); });
      return;
    }

    if (act === 'clear') {
      call('clearShoppingChecks', weekStart).then(reload).catch(function (err) { toast(errMsg(err), true); });
      return;
    }

    if (act === 'share') { shareShoppingList(weekStart); return; }
    if (act === 'email') { emailShoppingListPrompt(weekStart); return; }

    if (e.target.matches('input[type="checkbox"]')) {
      var li = e.target.closest('.shop-item');
      var key = li.getAttribute('data-key');
      var checked = e.target.checked;
      li.classList.toggle('checked', checked); // optimistic
      if (ITEMS[key]) ITEMS[key].checked = checked;
      callQuiet('setShoppingItemChecked', weekStart, key, checked)
        .then(function () {
          // Ticking a staple means we have it again — keep the cupboard tab honest.
          if (ITEMS[key] && ITEMS[key].pantry) STATE.pantry = null;
        })
        .catch(function (err) {
          li.classList.toggle('checked', !checked);
          e.target.checked = !checked;
          if (ITEMS[key]) ITEMS[key].checked = !checked;
          toast(errMsg(err), true);
        });
    }
  });

  var key = function (ev) { if (ev.key === 'Escape') closeShoppingList(); };
  _shop = { backdrop: backdrop, key: key, fromNav: !!opts.fromNav };
  setTimeout(function () { document.addEventListener('keydown', key, true); }, 0);
}

// Hand the list to the phone: the native share sheet where there is one (so it
// lands in WhatsApp/Notes/Messages), clipboard otherwise.
function shareShoppingList(weekStart) {
  call('getShoppingListText', weekStart).then(function (text) {
    if (!text) { toast('Nothing to send yet.'); return; }
    if (navigator.share) {
      navigator.share({ title: 'Shopping list', text: text })
        .catch(function () { /* user dismissed the sheet — not an error */ });
      return;
    }
    copyText(text)
      .then(function () { toast('List copied — paste it wherever you like.'); })
      .catch(function () { toast('Could not copy the list.', true); });
  }).catch(function (err) { toast(errMsg(err), true); });
}

function emailShoppingListPrompt(weekStart) {
  var to = window.prompt('Email the list to:', STATE.userEmail || '');
  if (to === null) return;
  call('emailShoppingList', weekStart, to.trim())
    .then(function (sent) { toast('Sent to ' + sent); })
    .catch(function (err) { toast(errMsg(err), true); });
}

/** Clipboard write with a textarea fallback for older mobile browsers. */
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (resolve, reject) {
    var ta = el('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

//// --- rotations -------------------------------------------------------- ////

function renderRotations() {
  var node = mountView('view-rotations');
  var form = bind(node, 'form');
  var picker = bind(node, 'picker');

  function addStep(selectedId) {
    var sel = el('select', { 'class': 'rot-step' });
    sel.innerHTML = STATE.templates.map(function (t) {
      return '<option value="' + esc(t.templateId) + '"' +
        (t.templateId === selectedId ? ' selected' : '') + '>' + esc(t.name) + '</option>';
    }).join('');
    picker.appendChild(sel);
  }

  function paintList() {
    var list = bind(node, 'list');
    list.innerHTML = STATE.rotations.length ? '' : '<p class="muted">No rotations yet.</p>';
    STATE.rotations.forEach(function (r) {
      var seq = r.sequence.map(function (s, i) {
        return (i + 1) + '. ' + esc(s.templateName);
      }).join(' &nbsp;→&nbsp; ');
      var card = el('div', { 'class': 'card' },
        '<div class="row"><strong>' + esc(r.name) + '</strong>' +
        '<span class="pill">' + r.lengthWeeks + '-week cycle</span>' +
        '<div class="spacer"></div>' +
        '<button class="ghost" data-apply="' + esc(r.rotationId) + '">Apply…</button>' +
        '<button class="ghost danger" data-del="' + esc(r.rotationId) + '">Delete</button></div>' +
        '<div class="muted" style="margin-top:.4rem">' + (seq || '—') + '</div>');
      list.appendChild(card);
    });
  }

  node.addEventListener('click', function (e) {
    var act = e.target.getAttribute('data-act');
    if (act === 'new') {
      if (!STATE.templates.length) { toast('Create a template first (from a week).', true); return; }
      form.classList.remove('hidden');
      if (!picker.children.length) addStep();
    }
    if (act === 'cancel') { form.reset(); picker.innerHTML = ''; form.classList.add('hidden'); }
    if (act === 'add-step') addStep();

    var applyId = e.target.getAttribute('data-apply');
    if (applyId) applyRotationFlow(applyId);
    var delId = e.target.getAttribute('data-del');
    if (delId && confirm('Delete this rotation?')) {
      call('deleteRotation', delId).then(function () {
        STATE.rotations = STATE.rotations.filter(function (r) { return r.rotationId !== delId; });
        toast('Rotation deleted'); paintList();
      }).catch(function (err) { toast(errMsg(err), true); });
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = new FormData(form).get('name');
    var templateIds = qsa('.rot-step', picker).map(function (s) { return s.value; });
    if (!templateIds.length) { toast('Add at least one week.', true); return; }
    call('createRotation', { name: name, templateIds: templateIds })
      .then(function () { return call('getRotations'); })
      .then(function (rotations) {
        STATE.rotations = rotations;
        form.reset(); picker.innerHTML = ''; form.classList.add('hidden');
        toast('Rotation created'); paintList();
      }).catch(function (err) { toast(errMsg(err), true); });
  });

  paintList();
}

function applyRotationFlow(rotationId) {
  var start = prompt('Start date (any day in the first week, yyyy-mm-dd):',
    (STATE.overview && STATE.overview.start) || new Date().toISOString().slice(0, 10));
  if (!start) return;
  var weeks = prompt('How many weeks to fill?', '4');
  if (!weeks) return;
  call('applyRotation', rotationId, start, Number(weeks)).then(function (res) {
    toast('Filled ' + res.weeksCreated + ' weeks'); invalidateOverview();
    location.hash = '#/overview';
  }).catch(function (e) { toast(errMsg(e), true); });
}

//// --- misc ------------------------------------------------------------- ////

function invalidateOverview() { STATE.overview = null; }
function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }

// Render a meal name, linking to its recipe URL (new tab) when one is set.
// Looks the URL up from the in-memory meal cache by id.
function mealLabel(mealId, fallbackName) {
  var name = fallbackName || '';
  var meal = mealId ? STATE.meals.filter(function (m) { return m.mealId === mealId; })[0] : null;
  if (meal && meal.url) {
    return '<a class="recipe-link" href="' + esc(meal.url) +
      '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(name) + ' ↗</a>';
  }
  return esc(name);
}
function errMsg(e) { return (e && e.message) ? e.message : 'Something went wrong.'; }

/**
 * 45 → "45 min", 90 → "1 hr 30", 120 → "2 hr", 65 → "1 hr 5".
 * Empty string for no/unknown time.
 *
 * This used to zero-pad the minutes ("1 h 05"), which read as a clock time
 * rather than a duration — the wrong thing entirely when the number is how
 * long you'll be cooking. "h" became "hr" for the same reason.
 */
function fmtMins(mins) {
  var n = Math.round(Number(mins));
  if (!isFinite(n) || n <= 0) return '';
  if (n < 60) return n + ' min';
  var h = Math.floor(n / 60), m = n % 60;
  return m ? h + ' hr ' + m : h + ' hr';
}

/** The ⏱ pill shown wherever a meal's time is known. */
function timeBadge(mins, cls) {
  var t = fmtMins(mins);
  return t ? '<span class="' + (cls || 'time-badge') + '"><svg class="i"><use href="#ic-clock"/></svg>' + t + '</span>' : '';
}

//// --- boot ------------------------------------------------------------- ////

window.addEventListener('hashchange', router);
window.addEventListener('load', function () {
  // STATE.span is restored from localStorage at load, above, so the very first
  // overview comes back at the right size rather than being corrected later.
  call('getBootstrapData', STATE.span).then(function (data) {
    STATE.meals = (data.meals || []).sort(function (a, b) { return a.name.localeCompare(b.name); });
    STATE.templates = data.templates || [];
    STATE.rotations = data.rotations || [];
    STATE.overview = data.overview;
    STATE.overviewStart = data.overview ? data.overview.start : null;
    STATE.collections = data.collections || [];
    STATE.userEmail = data.userEmail || '';
    STATE.hasAi = !!data.hasAi;
    router();
  }).catch(function (e) {
    qs('#view').innerHTML = '<div class="card"><h2>Could not load data</h2><p class="muted">' +
      esc(errMsg(e)) + '</p><p class="muted">If this is a fresh install, run <code>bootstrap()</code> ' +
      'in the Apps Script editor first.</p></div>';
  });
});
</script>


<style>
  .token-gate { position: fixed; inset: 0; z-index: 400; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .token-card { width: 100%; max-width: 420px; text-align: center; } /* narrow-ok: single form field */
  .token-card svg { width: 56px; height: 56px; stroke: var(--accent); }
  .token-card h2 { margin: 12px 0 4px; }
  .token-card p { color: var(--muted); margin: 0 0 18px; }
  .token-card input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; text-align: center; }
  .token-card button { width: 100%; padding: 12px; font-size: 16px; }
  .token-err { color: var(--danger); min-height: 1.2em; margin-top: 10px; }
</style>
<div id="token-gate" class="token-gate hidden">
  <div class="token-card">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>
    <h2>Menu Planner</h2>
    <p>Paste the household key to connect this device. You only do this once.</p>
    <input id="token-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="household key">
    <button id="token-go" class="primary">Connect</button>
    <div id="token-err" class="token-err"></div>
  </div>
</div>

<script>
//// PWA transport: replaces the google.script.run bridge defined in js_app. ////
//
// This file is inlined AFTER js_app by scripts/build-web.js, so the function
// declarations below override the HtmlService versions before `load` fires.
// Everything else in the client is transport-agnostic and untouched.
//
// Requests go as text/plain so the browser skips the CORS preflight (Apps
// Script cannot answer OPTIONS); the response comes back after Google's
// redirect with Access-Control-Allow-Origin: *.

var API_URL = 'https://script.google.com/macros/s/AKfycbx5PZU0qpUzKgx7YPJpLVlO4bqvGJozevo7XjyttEjMiMSMigQgY2g7GlK3rRBML548qA/exec';

// Reads that are safe to serve stale when there is no signal (the supermarket
// case). Cached per fn+args in localStorage after every successful fetch.
var MP_CACHEABLE = [
  'getBootstrapData', 'getShoppingList', 'getOverview', 'getMeals',
  'getPantry', 'getShoppingListText', 'getMealChoices',
  'getResolvedSlotChoices', 'getRotations'
];
// Writes worth queueing offline rather than failing: ticking things off
// mid-shop. Anything else failing offline should be loud, not silently queued.
var MP_QUEUEABLE = ['setShoppingItemChecked', 'setPantryNeeded'];

var MP_CACHE_PREFIX = 'mpc:';
var MP_QUEUE_KEY = 'mpq';
var MP_TOKEN_KEY = 'mp.token';

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  showLoader(true);
  return mpRpc_(fn, args).then(
    function (r) { showLoader(false); return r; },
    function (e) { showLoader(false); throw e; }
  );
}

function callQuiet(fn) {
  return mpRpc_(fn, Array.prototype.slice.call(arguments, 1));
}

function mpRpc_(fn, args) {
  return mpEnsureToken_().then(function (token) {
    return fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ token: token, fn: fn, args: args })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (r) {
      if (!r.ok) throw new Error(r.error || 'Server error');
      mpCachePut_(fn, args, r.result);
      mpFlushQueue_();
      return r.result;
    });
  }).catch(function (e) {
    if (!mpIsNetworkError_(e)) throw e;
    var hit = mpCacheGet_(fn, args);
    if (hit) {
      toast('Offline — showing your saved copy');
      return hit;
    }
    if (MP_QUEUEABLE.indexOf(fn) !== -1) {
      mpQueuePush_(fn, args);
      toast('Offline — saved, will sync later');
      return null;
    }
    throw new Error('You are offline and this needs a connection.');
  });
}

// fetch() rejects with a TypeError when the network itself fails; anything the
// server actually said comes through as our own Error above.
function mpIsNetworkError_(e) {
  return (e instanceof TypeError) || /Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message));
}

//// --- offline cache ---------------------------------------------------- ////

function mpCacheKey_(fn, args) { return MP_CACHE_PREFIX + fn + ':' + JSON.stringify(args || []); }

function mpCachePut_(fn, args, value) {
  if (MP_CACHEABLE.indexOf(fn) === -1) return;
  try {
    localStorage.setItem(mpCacheKey_(fn, args), JSON.stringify({ t: Date.now(), v: value }));
    mpCachePrune_();
  } catch (e) { /* full or private browsing — the app still works online */ }
}

function mpCacheGet_(fn, args) {
  try {
    var raw = localStorage.getItem(mpCacheKey_(fn, args));
    return raw ? JSON.parse(raw).v : null;
  } catch (e) { return null; }
}

// Keep the cache bounded: drop the oldest entries beyond 40.
function mpCachePrune_() {
  var keys = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(MP_CACHE_PREFIX) === 0) keys.push(k);
  }
  if (keys.length <= 40) return;
  keys.sort(function (a, b) {
    var ta = 0, tb = 0;
    try { ta = JSON.parse(localStorage.getItem(a)).t || 0; } catch (e) {}
    try { tb = JSON.parse(localStorage.getItem(b)).t || 0; } catch (e) {}
    return ta - tb;
  });
  keys.slice(0, keys.length - 40).forEach(function (k) { localStorage.removeItem(k); });
}

//// --- offline write queue ---------------------------------------------- ////

function mpQueueRead_() {
  try { return JSON.parse(localStorage.getItem(MP_QUEUE_KEY)) || []; } catch (e) { return []; }
}

function mpQueuePush_(fn, args) {
  var q = mpQueueRead_();
  q.push({ fn: fn, args: args, t: Date.now() });
  try { localStorage.setItem(MP_QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
  // A tick made offline must survive an offline re-render, so patch the cached
  // shopping list too: anywhere an object carries this key with a `checked`
  // field, update it. Structure-agnostic on purpose.
  if (fn === 'setShoppingItemChecked') mpPatchCachedChecks_(args[0], args[1], args[2]);
}

function mpPatchCachedChecks_(weekStart, itemKey, checked) {
  var key = mpCacheKey_('getShoppingList', [weekStart]);
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return;
    var entry = JSON.parse(raw);
    (function walk(node) {
      if (!node || typeof node !== 'object') return;
      if (node.key === itemKey && 'checked' in node) node.checked = !!checked;
      Object.keys(node).forEach(function (k) { walk(node[k]); });
    })(entry.v);
    localStorage.setItem(key, JSON.stringify(entry));
  } catch (e) {}
}

var mpFlushing_ = false;
function mpFlushQueue_() {
  if (mpFlushing_) return;
  var q = mpQueueRead_();
  if (!q.length) return;
  mpFlushing_ = true;
  var token = localStorage.getItem(MP_TOKEN_KEY);
  (function next() {
    var job = q.shift();
    if (!job) {
      try { localStorage.removeItem(MP_QUEUE_KEY); } catch (e) {}
      mpFlushing_ = false;
      toast('Back online — synced');
      return;
    }
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ token: token, fn: job.fn, args: job.args }) })
      .then(function (res) { return res.json(); })
      .then(function () {
        try { localStorage.setItem(MP_QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
        next();
      })
      .catch(function () { mpFlushing_ = false; /* still offline; try again later */ });
  })();
}

window.addEventListener('online', mpFlushQueue_);

//// --- token gate ------------------------------------------------------- ////

var mpTokenPromise_ = null;

function mpEnsureToken_() {
  var stored = null;
  try { stored = localStorage.getItem(MP_TOKEN_KEY); } catch (e) {}
  if (stored) return Promise.resolve(stored);
  if (mpTokenPromise_) return mpTokenPromise_;

  mpTokenPromise_ = new Promise(function (resolve) {
    var gate = document.getElementById('token-gate');
    var input = document.getElementById('token-input');
    var btn = document.getElementById('token-go');
    var err = document.getElementById('token-err');
    gate.classList.remove('hidden');
    showLoader(false);
    input.focus();

    function submit() {
      var token = input.value.trim();
      if (!token) return;
      btn.disabled = true;
      err.textContent = '';
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ op: 'ping', token: token }) })
        .then(function (res) { return res.json(); })
        .then(function (r) {
          if (!r.ok) throw new Error(r.error || 'That key was not accepted.');
          try { localStorage.setItem(MP_TOKEN_KEY, token); } catch (e) {}
          gate.classList.add('hidden');
          mpTokenPromise_ = null;
          resolve(token);
        })
        .catch(function (e) {
          btn.disabled = false;
          err.textContent = mpIsNetworkError_(e) ? 'No connection — try again with signal.' : String(e.message || e);
        });
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
  });
  return mpTokenPromise_;
}

//// --- service worker --------------------------------------------------- ////

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* http or unsupported */ });
  });
}
</script>
</body>
