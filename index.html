  .day .split { display: block; }
  .day .split .half + .half { margin-top: .35rem; padding-top: .35rem; border-top: 1px dashed var(--line); }
  .day .half-lbl {
    display: block; font-family: var(--font-body); font-size: .74rem; font-weight: 800;
    letter-spacing: .05em; text-transform: uppercase; color: var(--accent-dk); margin-bottom: .1rem;
  }
  .day.mb-day.is-split .nm { font-size: clamp(1.15rem, 1.6vw, 1.5rem); }
  .day.tile.is-split .nm { font-size: .94rem; }
  /* leftovers marker — a small recycle glyph before a no-cook repeat */
  .lo-badge { color: var(--accent); font-weight: 700; margin-right: .2rem; font-family: var(--font-body); }

  /* ---------- Menu list ----------
     Sections by shelf, not one alphabetical wall. Cards are deliberately tight:
     they used to reserve 2.1rem of dead space at the bottom for a row of icon
     controls that have all moved into a single "..." menu. */
  .meal-list { display: block; }
  .shelf-head {
    display: flex; align-items: baseline; gap: .5rem;
    font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 1.5rem 0 .55rem;
  }
  .shelf-head:first-child { margin-top: .2rem; }
  .shelf-head-n {
    font-size: .68rem; font-weight: 700; letter-spacing: 0; color: var(--accent-dk);
    background: var(--tag-bg); border-radius: 999px; padding: .08rem .45rem;
  }
  .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: .5rem; }
  .meal {
    position: relative;
    background: var(--card);
    border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: .6rem .7rem .65rem;
    box-shadow: var(--card-shadow); cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .meal:hover { transform: translateY(-1px); box-shadow: var(--card-shadow-hi); border-color: #c8e3d0; }
  .meal.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--card-shadow); }
  .meal-top { display: flex; align-items: flex-start; gap: .3rem; }
  .meal .name {
    font-family: var(--font-head); font-weight: 700; font-size: .92rem; line-height: 1.25;
    flex: 1; min-width: 0; overflow-wrap: anywhere;
  }
  /* The one way in. Quiet until the card is touched, so a grid of these reads as
     dishes rather than as a grid of buttons. */
  .meal-more {
    flex: none; width: 26px; height: 26px; min-height: 0; padding: 0;
    border: 0; background: none; box-shadow: none; border-radius: 999px;
    color: var(--empty);
  }
  .meal:hover .meal-more, .meal-more:focus-visible { color: var(--muted); background: var(--surface); }
  .meal-more:hover { color: var(--ink); background: var(--tag-bg); transform: none; }
  @media (hover: none) { .meal-more { color: var(--muted); } }
  .meal-norecipe {
    display: inline-block; margin-top: .3rem;
    font-size: .64rem; font-weight: 700; letter-spacing: .02em;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: .08rem .4rem;
  }
  /* variations: a flatter card with an accent edge so they read as a child dish */
  .meal.meal-var { border-left: 3px solid var(--accent); background: var(--surface); }
  .meal.meal-var .name { font-size: .86rem; }

  /* auto-fill rule badges on a meal card */
  .mflags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .35rem; }
  .mflag {
    font-size: .66rem; font-weight: 700; letter-spacing: .01em;
    border-radius: 999px; padding: .1rem .45rem; line-height: 1.35;
    border: 1px solid transparent;
  }
  .mflag.wd { background: #eef4ff; color: #34548a; }
  .mflag.we { background: #fdf0e6; color: #9a5a23; }
  .mflag.lo { background: #eafaf0; color: #2f7d4f; }
  .mflag.po { background: #f3eefb; color: #6b4a9a; }

  /* Selected for a week: a tick in the corner of the card. */
  .meal .check {
    position: absolute; top: -6px; left: -6px;
    width: 20px; height: 20px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    display: none; align-items: center; justify-content: center;
    font-size: .6rem; line-height: 1;
  }
  .meal.selected .check { display: flex; }

  /* Which shelves one meal sits on — opened from its "..." menu, not shown on
     the card, because a dish you already know is Italian doesn't need telling. */
  .shelf-edit { padding: .7rem .75rem .8rem; max-width: 320px; } /* narrow-ok: popover */
  .shelf-edit-h {
    font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: .5rem;
  }
  .shelf-edit-chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  .shelf-edit-chips .shelf { font-size: .76rem; padding: .3rem .6rem; min-height: 30px; }

  /* flag checkboxes in the add/edit meal form */
  .flag-check { display: flex; align-items: flex-start; gap: .4rem; font-weight: 600; cursor: pointer; }
  .flag-check input { width: auto; margin-top: .15rem; }
  .flag-check small { font-weight: 500; }

  .tag {
    display: inline-block; font-size: .72rem; font-weight: 700; background: var(--tag-bg); color: var(--tag-ink);
    border-radius: 999px; padding: .14rem .6rem; margin: .25rem .2rem 0 0;
  }
  .recipe-link { color: var(--accent); text-decoration: none; font-weight: 700; }
  .recipe-link:hover { text-decoration: underline; }

  /* ---------- recipe time ----------
     One ⏱ pill, a few sizes: on a menu tile, in the meal card's header, in the
     import log, and in a planned day's own column. Same fact everywhere it's
     decided on. (.dtime's own size and placement are set with the day layouts
     above; this only gives it the icon alignment.) */
  .time-badge, .meal-time, .sheet-time, .nm-time, .dtime {
    display: inline-flex; align-items: center; gap: .25em;
    font-weight: 600; white-space: nowrap;
  }
  .time-badge, .meal-time, .sheet-time, .nm-time { color: var(--muted); }
  .meal-time { font-size: .72rem; margin-top: .35rem; }
  .sheet-time { font-size: .8rem; margin-top: .45rem; }
  .nm-time { font-size: .68rem; margin-left: .45em; position: relative; top: -.06em; }
  .time-badge svg.i, .meal-time svg.i, .sheet-time svg.i, .nm-time svg.i, .dtime svg.i {
    width: 1.05em; height: 1.05em; stroke-width: 2;
  }

  /* ---------- bulk URL import log ---------- */
  .import-log {
    margin-top: .7rem; max-height: 200px; overflow-y: auto;
    font-size: .82rem; line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: .5rem;
  }
  .import-log div { overflow-wrap: anywhere; }

  /* recipe URL control in a menu tile's top-right corner (+ to add, ↗ open, ✎ edit) */
  .meal .recipe-row { position: absolute; top: .55rem; right: .6rem; display: flex; align-items: center; gap: .2rem; margin: 0; }
  .recipe-add {
    background: transparent; border: 1px dashed var(--empty); color: var(--accent-dk);
    font-size: .72rem; font-weight: 700; padding: .18rem .55rem; border-radius: 999px;
  }
  .recipe-add:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); box-shadow: none; }
  .meal .recipe-link {
    font-size: .92rem; line-height: 1; padding: .12rem .3rem; border-radius: 999px;
    border: 1px solid var(--line); background: #fff;
  }
  .meal .recipe-link:hover { color: var(--accent); border-color: #e2ddd2; text-decoration: none; background: var(--tag-bg); }
  .recipe-edit {
    background: transparent; border: none; box-shadow: none; color: var(--muted);
    padding: .1rem .3rem; font-size: .82rem; line-height: 1; border-radius: 999px;
  }
  .recipe-edit:hover { color: var(--accent); background: var(--tag-bg); box-shadow: none; border-color: transparent; }
  .recipe-detail {
    background: transparent; border: none; box-shadow: none; color: var(--muted);
    padding: .1rem .28rem; font-size: .9rem; line-height: 1; border-radius: 999px; filter: grayscale(1); opacity: .5;
  }
  .recipe-detail:hover { background: var(--tag-bg); box-shadow: none; border-color: transparent; filter: none; opacity: 1; }
  .recipe-detail.has { filter: none; opacity: 1; } /* meal already has ingredients/method */

  /* recipe URL editor popover (reuses .mpick chrome) */
  .uedit { width: 280px; }
  .uedit .uedit-input { font-size: .85rem; }

  /* ---------- meal detail modal (ingredients / method + photo scan) ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20,20,18,.42); backdrop-filter: blur(2px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 1.5rem 1rem; overflow-y: auto;
  }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--card-shadow-hi); width: 100%; max-width: 560px; margin: auto; /* narrow-ok: modal dialog */
    padding: 1.1rem 1.2rem 1.2rem;
  }
  .modal-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .9rem; }
  .modal-title { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; margin: 0; flex: 1; line-height: 1.1; }
  .modal-x { font-size: 1.3rem; line-height: 1; padding: .1rem .45rem; color: var(--muted); border: none; }
  .modal .scan-box {
    border: 1px dashed var(--empty); border-radius: var(--radius-sm);
    padding: .7rem .8rem; margin-bottom: 1rem; background: var(--bg);
  }
  .modal .scan-status { font-size: .8rem; }
  .scan-pages { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
  .scan-page {
    position: relative; width: 54px; height: 54px; border-radius: var(--radius-sm);
    overflow: hidden; border: 1px solid var(--line); background: #fff;
  }
  .scan-page img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-page-n {
    position: absolute; left: 2px; bottom: 2px;
    background: rgba(20,20,18,.72); color: #fff; font-size: .6rem; font-weight: 700;
    line-height: 1; padding: .1rem .28rem; border-radius: 999px;
  }
  .scan-page-x {
    position: absolute; top: 1px; right: 1px;
    width: 17px; height: 17px; padding: 0; border-radius: 999px; line-height: 1;
    font-size: .85rem; display: flex; align-items: center; justify-content: center;
    background: rgba(20,20,18,.72); color: #fff; border: none; box-shadow: none;
  }
  .scan-page-x:hover { background: var(--danger); transform: none; }
  .modal label { margin-top: .2rem; }
  .modal .md-field { resize: vertical; font-family: var(--font-body); line-height: 1.45; margin-bottom: .7rem; }
  .modal input[type="url"] { margin-bottom: .2rem; }
  .modal .modal-foot { gap: .6rem; margin-top: 1rem; }

  /* ---------- shopping list modal ---------- */
  .shop-modal { max-height: 82vh; overflow-y: auto; }
  .shop-group { margin-bottom: 1rem; }
  .shop-group-head {
    font-weight: 700; font-size: .84rem; color: var(--accent-dk);
    border-bottom: 1px solid var(--line); padding-bottom: .3rem; margin-bottom: .4rem;
  }
  .shop-items { list-style: none; margin: 0; padding: 0; }
  .shop-item label {
    display: flex; align-items: center; gap: .55rem; margin: 0;
    padding: .35rem .15rem; cursor: pointer; font-size: .92rem;
  }
  .shop-item input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
  .shop-item.checked .shop-label { color: var(--muted); text-decoration: line-through; }
  .shop-label { flex: 1; }
  /* Which meals put this on the list — quiet, but answers "why 3 onions?". */
  .shop-why { font-size: .72rem; color: var(--muted); flex: none; text-align: right; }

  /* Which week you're shopping for — you often shop a week ahead, so this has to
     be changeable here rather than by backing out into the planner. */
  .shop-weeknav {
    display: flex; align-items: center; justify-content: center; gap: .3rem;
    margin: -.4rem 0 .5rem; font-size: .82rem; font-weight: 600; color: var(--muted);
  }
  .shop-weeknav button {
    background: none; border: none; box-shadow: none;
    padding: .15rem .5rem; font-size: 1rem; line-height: 1; color: var(--accent-dk);
  }
  .shop-weeknav button:hover { background: var(--tag-bg); transform: none; }

  .shop-tabs { display: flex; gap: .3rem; margin: .2rem 0 .9rem; border-bottom: 1px solid var(--line); }
  .shop-tab {
    background: none; border: none; box-shadow: none;
    padding: .4rem .7rem; font-size: .84rem; font-weight: 600;
    color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0;
  }
  .shop-tab:hover { color: var(--ink); background: none; transform: none; }
  .shop-tab.on { color: var(--accent-dk); border-bottom-color: var(--accent); }
  .shop-foot { flex-wrap: wrap; }

  /* Tap a meal in the full sheet too — same behaviour as the list under the
     plan, different markup. Nothing is hidden; the rest just recedes. */
  .shop-modal .live-meals { border-bottom-color: var(--line); }
  .shop-modal.filtering .shop-label,
  .shop-modal.filtering .shop-why { color: var(--empty); }
  .shop-modal.filtering .shop-item.hit { background: var(--tag-bg); border-radius: 8px; }
  .shop-modal.filtering .shop-item.hit .shop-label { color: var(--ink); font-weight: 700; }
  .shop-modal.filtering .shop-item.hit .shop-why { color: var(--accent-dk); }
  .shop-modal.filtering .shop-group-head { color: var(--empty); }
  .shop-modal.filtering .shop-group.has-hit .shop-group-head { color: var(--accent-dk); }

  .shop-missing {
    margin-top: .6rem; padding: .6rem .7rem; font-size: .84rem;
    background: var(--tag-bg); border-radius: var(--radius-sm);
  }
  .link-btn {
    background: none; border: none; box-shadow: none; padding: 0;
    color: var(--accent-dk); font: inherit; text-decoration: underline;
  }
  .link-btn:hover { background: none; transform: none; color: var(--accent); }

  /* ---------- cupboard staples ---------- */
  .pantry-list { list-style: none; margin: 0; padding: 0; }
  .pantry-row {
    display: flex; align-items: center; gap: .5rem;
    padding: .35rem 0; border-bottom: 1px solid var(--line-soft); font-size: .9rem;
  }
  .pantry-name { flex: 1; }
  .pantry-aisle { font-size: .72rem; flex: none; }
  .pantry-row.needed .pantry-name { font-weight: 700; color: var(--accent-dk); }
  .pantry-buy { font-size: .76rem; padding: .25rem .5rem; flex: none; }
  .pantry-row.needed .pantry-buy { background: var(--tag-bg); color: var(--tag-ink); }
  .pantry-x { font-size: .9rem; padding: .2rem .45rem; flex: none; color: var(--muted); }
  .pantry-x:hover { background: var(--danger-bg); color: var(--danger); }

  /* ---------- meal choice groups (what varies week to week) ---------- */
  .choice-box {
    margin: -.2rem 0 .8rem; padding: .6rem .7rem;
    background: var(--cell-alt); border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .choice-head { font-weight: 700; font-size: .8rem; color: var(--accent-dk); margin-bottom: .45rem; }
  .choice-group { margin-bottom: .5rem; }
  .choice-name { font-size: .8rem; font-weight: 600; }
  .choice-opts { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .25rem; }
  .choice-opt {
    font-size: .76rem; padding: .25rem .6rem; border-radius: 99px;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    box-shadow: none; font-weight: 500;
  }
  .choice-opt:hover { border-color: var(--accent); color: var(--ink); transform: none; }
  /* The usual pick — what the shopping list assumes until you choose per day. */
  .choice-opt.on { background: var(--ink); border-color: var(--ink); color: var(--on-accent); }
  .choice-opt.on:hover { background: var(--accent-dk); border-color: var(--accent-dk); color: var(--on-accent); }

  /* ---------- menu shelves (the filter chips) ---------- */
  .shelf-row {
    display: flex; flex-wrap: wrap; gap: .35rem;
    margin: .2rem 0 .9rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line);
  }
  .shelf {
    font-size: .82rem; font-weight: 700; padding: .4rem .8rem; min-height: 36px;
    border-radius: 999px; background: var(--card); border: 1.5px solid var(--line);
    color: var(--muted);
  }
  .shelf:hover { border-color: var(--accent); color: var(--ink); }
  .shelf.on { background: var(--ink); border-color: var(--ink); color: var(--on-accent); }
  /* The count is the useful part when deciding which shelf to open. */
  .shelf-n { font-weight: 600; opacity: .55; margin-left: .1rem; }

  /* The shelves a meal sits on, shown small on its tile. */
  .mshelves { display: flex; flex-wrap: wrap; gap: .22rem; margin-top: .3rem; }
  .mshelf {
    font-size: .64rem; font-weight: 700; letter-spacing: .02em;
    padding: .1rem .42rem; border-radius: 999px;
    background: var(--surface); color: var(--muted); border: 1px solid var(--line);
  }

  /* ---------- selection bar (menu) ---------- */
  .select-bar {
    position: sticky; bottom: 0; z-index: 4;
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    margin-top: 1rem; padding: .7rem .9rem;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 -4px 16px rgba(20,20,18,.08);
  }
  .sel-count { font-weight: 700; color: var(--accent-dk); }
  .sel-week-lbl { font-size: .8rem; font-weight: 700; color: var(--muted); margin: 0; }

  /* ---------- Week editor (drag & drop) ---------- */
  .save-state { font-weight: 700; font-size: .82rem; color: var(--muted); min-width: 60px; }
  .save-state.err { color: var(--danger); }
  .grip-inline { color: var(--accent); font-weight: 800; }

  .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: .55rem; }
  .wday {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--card-shadow); padding: .5rem .45rem .6rem;
    min-height: 124px; display: flex; flex-direction: column;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .wday.drop-hi {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 0 0 2px var(--accent), var(--card-shadow-hi);
  }
  .wday-head { display: flex; align-items: baseline; gap: .3rem; margin-bottom: .4rem; }
  .wday-head .grip {
    cursor: grab; color: var(--empty); font-size: .9rem; line-height: 1;
    touch-action: none; user-select: none; padding: 0 .1rem;
  }
  .wday-head .grip:hover { color: var(--accent); }
  .wday-head .dow {
    font-family: var(--font-head); font-size: .68rem; font-weight: 700;
    color: var(--accent-dk); text-transform: uppercase; letter-spacing: .05em;
  }
  .wday-head .wdate { font-size: .64rem; color: var(--muted); font-weight: 600; margin-left: auto; }
  .wday-body { display: flex; flex-direction: column; gap: .35rem; flex: 1; }

  .slotzone { border-radius: var(--radius-sm); min-height: 40px; display: flex; flex-direction: column; gap: .25rem; }
  .slotzone.drop-hi { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .slot-type { font-size: .62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }

  .chip {
    display: flex; align-items: center; gap: .3rem;
    background: var(--ink); color: #fff; border-radius: var(--radius-sm);
    padding: .42rem .5rem; font-weight: 600; font-size: .82rem; line-height: 1.2;
    cursor: grab; touch-action: none; user-select: none; box-shadow: var(--card-shadow);
  }
  .chip:hover { background: #000; }
  .chip .chip-name { flex: 1; word-break: break-word; }
  .chip .chip-rec { flex: none; font-size: .82rem; line-height: 1; opacity: .85; }
  /* split halves: slightly tighter, with an "Adults"/"Kids" tag */
  .chip.half { padding: .32rem .5rem; font-size: .78rem; }
  .chip .chip-role {
    flex: none; font-size: .58rem; font-weight: 800; letter-spacing: .04em;
    text-transform: uppercase; background: rgba(255,255,255,.18);
    border-radius: 999px; padding: .08rem .35rem;
  }
  .slotzone.has-split { gap: .2rem; }

  .addslot {
    border: 1px dashed var(--empty); border-radius: var(--radius-sm);
    color: var(--empty); font-size: .76rem; font-weight: 700; text-align: center;
    padding: .55rem .3rem; cursor: pointer; transition: all .12s ease;
  }
  .addslot:hover { border-color: var(--accent); color: var(--accent-dk); background: var(--tag-bg); }

  body.dragging { cursor: grabbing; user-select: none; }
  .drag-ghost {
    position: fixed; z-index: 40; pointer-events: none; transform: translate(-50%, -120%);
    background: var(--ink); color: #fff;
    font-weight: 600; font-size: .82rem; padding: .35rem .6rem; border-radius: var(--radius-sm);
    box-shadow: var(--card-shadow-hi); max-width: 200px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .drag-ghost.day, .drag-ghost.ovday { background: var(--card); color: var(--ink); border: 1px solid var(--accent); }

  /* ---------- meal picker popover ---------- */
  .mpick {
    position: fixed; z-index: 35; width: 260px; max-width: calc(100vw - 16px);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--card-shadow-hi); padding: .55rem;
    display: flex; flex-direction: column; gap: .45rem;
  }
  .mpick-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: .2rem; }
  .mpick-item {
    display: flex; align-items: center; gap: .5rem; cursor: pointer;
    padding: .4rem .5rem; border-radius: var(--radius-sm); border: 1px solid transparent;
  }
  .mpick-item:hover { background: var(--tag-bg); }
  .mpick-item.cur { border-color: var(--accent); background: var(--tag-bg); }
  .mpick-item .mpick-name { flex: 1; font-weight: 600; font-size: .85rem; }
  .mpick-item .mpick-cat { font-size: .64rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .mpick-remove { align-self: stretch; }

  /* variations: indented child rows + the per-base "+ detail" control */
  .mpick-item.mpick-var { margin-left: .9rem; }
  .mpick-item.mpick-var .mpick-name { font-weight: 500; font-size: .82rem; }
  .mpick-item.mpick-var .mpick-name::before { content: "↳ "; color: var(--muted); }
  .mpick-adddetail {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: .68rem; font-weight: 700; padding: .12rem .4rem; border-radius: var(--radius-sm);
    box-shadow: none; white-space: nowrap;
  }
  .mpick-adddetail:hover { color: var(--accent-dk); border-color: var(--accent); background: var(--tag-bg); transform: none; }
  .mpick-detailrow { display: flex; gap: .35rem; margin: .1rem 0 .25rem .9rem; }
  .mpick-detail-input {
    flex: 1; min-width: 0; padding: .35rem .45rem; font-size: .82rem;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .mpick-detail-save { padding: .35rem .6rem; font-size: .8rem; }

  /* "Create "…"" row when the typed text is a brand-new meal */
  .mpick-create {
    display: flex; align-items: center; gap: .45rem; cursor: pointer;
    padding: .4rem .5rem; border-radius: var(--radius-sm);
    border: 1px dashed var(--accent); color: var(--accent-dk);
    font-size: .85rem; font-weight: 600;
  }
  .mpick-create:hover { background: var(--tag-bg); }
  .mpick-create .mpick-ic { width: 1.1rem; text-align: center; font-weight: 700; }

  /* slot action menu (tap a meal → Change · Recipe · Remove) */
  .smenu { width: 200px; padding: .35rem; gap: .1rem; }
  .smenu-item {
    display: flex; align-items: center; gap: .55rem; width: 100%;
    background: transparent; border: none; box-shadow: none; text-align: left;
    padding: .5rem .55rem; border-radius: var(--radius-sm);
    font-weight: 600; font-size: .88rem; color: var(--ink);
  }
  .smenu-item:hover { background: var(--tag-bg); box-shadow: none; border-color: transparent; transform: none; }
  .smenu-item.danger { color: var(--danger); }
  .smenu-item.danger:hover { background: var(--danger-bg); }
  .smenu-ic { width: 1.2rem; text-align: center; font-size: .95rem; line-height: 1; }

  /* "Open ↗" link beside the recipe URL field in the detail modal */
  .recipe-open {
    display: inline-flex; align-items: center; white-space: nowrap;
    padding: .55rem .8rem; border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--accent-dk); text-decoration: none; font-weight: 700; font-size: .85rem;
  }
  .recipe-open:hover { background: var(--tag-bg); border-color: #e2ddd2; }

  .pill {
    display: inline-block; font-family: var(--font-head); font-size: .76rem; font-weight: 700;
    padding: .2rem .7rem; border-radius: 999px; background: var(--tag-bg); color: var(--tag-ink);
  }

  /* ---------- utility ---------- */
  .hidden { display: none !important; }
  .loader { position: fixed; inset: 0; background: rgba(251,251,250,.65); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .spinner { width: 38px; height: 38px; border: 4px solid #e8e6df; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-weight: 600;
    padding: .65rem 1.1rem; border-radius: 999px;
    box-shadow: 0 10px 24px rgba(20,20,18,.3); z-index: 30; max-width: 90%;
  }
  .toast.err { background: #b1455f; box-shadow: 0 10px 24px rgba(177,69,95,.35); }

  /* Checkboxes and radios pick up the produce green instead of platform blue. */
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

  /* =================================================================
     PHONE — a different layout, not a smaller one.
     The week is a diary column (a week IS a list on a phone), the topbar
     drops ceremony instead of wrapping into a pile, and the shopping
     sheet goes full-screen with thumb-sized rows.
     ================================================================= */
  @media screen and (max-width: 720px) {
    body { -webkit-tap-highlight-color: transparent; }
    main { padding: .8rem .9rem 2rem; }

    /* ---- topbar: the nav IS the header; the app's name lives on the icon ---- */
    .topbar {
      gap: .45rem .6rem; padding: .55rem .9rem .5rem;
      padding-top: calc(.55rem + env(safe-area-inset-top));
    }
    .topbar h1 { display: none; }
    nav { flex: 1; display: flex; justify-content: space-between; gap: .1rem; }
    nav a { padding: .45rem .7rem; font-size: .88rem; }
    /* Per-view actions: one thumb-scrollable row, never a wrapped pile. */
    .view-actions {
      width: 100%; flex-wrap: nowrap; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      margin: 0 -.9rem; padding: .1rem .9rem .25rem;
    }
    .view-actions::-webkit-scrollbar { display: none; }
    .view-actions button { flex: none; }
    .spacer { display: none; }

    /* ---- the menu board: same layout, less ceremony ---- */
    .mb-sheet { padding: 1.1rem .9rem 1.2rem; border-radius: var(--radius-sm); }
    .mb-range { font-size: 1.65rem; }
    .mb-head { padding-bottom: 1rem; }

    /* Day number beside the dish, time on a second line, handle on the right. */
    .day.mb-day {
      grid-template-columns: 3.3rem minmax(0,1fr) auto;
      grid-template-areas: "num body grip" "num time grip";
      gap: .15rem .7rem; padding: .85rem .1rem; align-items: baseline;
    }
    .day.mb-day .dnum { grid-area: num; flex-direction: column; gap: 0; align-items: flex-start; }
    .day.mb-day .dnum b { font-size: 1.7rem; }
    .day.mb-day .dbody { grid-area: body; min-width: 0; }
    .day.mb-day .dtime { grid-area: time; font-size: .82rem; }
    .day.mb-day .dgrip { grid-area: grip; align-self: center; }
    .day.mb-day .nm { font-size: 1.3rem; }
    .day.mb-day.today { padding: 1.1rem .8rem 1.2rem; align-items: start; }
    .day.mb-day.today .dnum b { font-size: 2rem; }
    .day.mb-day.today .nm { font-size: 1.75rem; }
    .dacts .btn-hero { font-size: .84rem; padding: .5rem .85rem; }

    /* ---- Month: tiles stack into rows, one per line ---- */
    .tile-week { grid-template-columns: minmax(0,1fr); gap: .5rem; }
    .day.tile {
      min-height: 0; flex-direction: row; align-items: center;
      gap: .8rem; padding: .75rem .85rem;
    }
    .day.tile .dnum { flex: none; width: 3.1rem; flex-direction: column; align-items: flex-start; gap: 0; }
    .day.tile .dnum .dow { margin-left: 0; }
    .day.tile .nm { flex: 1; min-width: 0; font-size: .98rem; }
    .day.tile .dtime { margin-top: 0; margin-left: auto; }
    .day.tile.empty .nm { margin: 0; }

    /* Touch has no hover, so the drag handle is always there. */
    .dgrip { display: block; opacity: .5; }

    /* ---- live shopping list: bigger lines, two columns ---- */
    .live-list { padding: 1rem .9rem 1.2rem; }
    .live-aisles { grid-template-columns: 1fr 1fr; gap: .9rem 1rem; }
    .live-qty { font-size: .95rem; padding: .4rem .3rem; min-height: 40px; }
    .live-x { padding: .4rem .5rem; font-size: .95rem; }
    .live-meals { gap: .35rem; }
    .live-mchip { font-size: .84rem; padding: .4rem .8rem; }

    /* ---- modals become full-height sheets ---- */
    .modal-backdrop { padding: 0; }
    .modal {
      max-width: none; min-height: 100dvh; border-radius: 0; border: 0;
      padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    }
    /* The shopping sheet pins its header, tabs and actions; the list scrolls. */
    .shop-modal {
      max-height: 100dvh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .shop-modal > [data-bind="body"] {
      flex: 1; min-height: 0; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -1rem; padding: 0 1rem .5rem;
    }
    .shop-modal .modal-head, .shop-weeknav, .shop-tabs, .shop-foot { flex: none; }
    .shop-foot { border-top: 1px solid var(--line); padding-top: .7rem; margin-top: .4rem; }
    .shop-tab { font-size: .92rem; padding: .5rem .8rem; min-height: 44px; }
    .shop-item label { font-size: 1rem; padding: .55rem .15rem; }
    .shop-item input[type="checkbox"] { width: 22px; height: 22px; }
    .shop-why { max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-group-head { font-size: .9rem; padding-bottom: .4rem; }

    /* iOS zooms any focused field under 16px; don't give it a reason. */
    input, select, textarea { font-size: 16px; }

    .toast { bottom: calc(1.2rem + env(safe-area-inset-bottom)); }
    .sheet-body { padding-bottom: calc(1.4rem + env(safe-area-inset-bottom)); }

    /* Week editor: chips need room, so wrap to a few columns instead of 7. */
    .week-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* ---------- print: the 4-week overview onto paper / PDF ---------- */
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    /* Drop all app chrome — only the plan itself should reach the paper.
       .dkick goes too: a printout gets read on any day of the week, so
       "TONIGHT" over Thursday's dinner is worse than nothing. */
    .topbar, #loader, #toast,
    .modal-backdrop, .mpick, .uedit,
    [data-act], [data-shopweek], .mb-acts, .dacts, .dgrip, .live-meals, .dkick,
    .row .spacer { display: none !important; }
    main { padding: 0 !important; }

    /* The menu board is already a printed menu — it needs almost nothing. */
    .mb-sheet {
      box-shadow: none; border: 0; border-radius: 0; padding: 0;
      background: #fff !important;
    }
    .mb-sheet + .mb-sheet { margin-top: 10mm; }
    .mb-head { border-bottom: 1.5pt solid #000; padding-bottom: 4mm; }
    .mb-range { font-size: 20pt; }
    .mb-est, .wkhead .lab, .mb-lab { color: #555 !important; background: none !important; }

    .day { break-inside: avoid; cursor: default; }
    .day.mb-day { border-bottom: 0.5pt solid #ccc; padding: 3mm .5mm; }
    .day.mb-day.today { background: #fff !important; margin: 0; padding: 3mm .5mm; } /* no tint on paper */
    .day.mb-day.today .dnum b, .day.mb-day.today .dnum .dow, .day.mb-day.today .dtime { color: #000 !important; }
    /* Every day the same size on paper. Fixed points, not the screen's clamp():
       vw units resolve against the sheet and today's row previously inherited
       body size here, which printed tonight's dinner smaller than every other
       day — exactly backwards. */
    .day.mb-day .nm, .day.mb-day.today .nm { font-size: 15pt; line-height: 1.2; }
    .day.mb-day.is-split .nm { font-size: 12pt; }
    .dnum b, .day.mb-day.today .dnum b { font-size: 15pt; color: #000 !important; }
    .day .nm, .day .nm .recipe-link { color: #000 !important; text-decoration: none; }
    .day.empty .nm { color: #bbb !important; }

    /* Month prints as the tile grid it is on screen. */
    .day.tile {
      min-height: 20mm; border: 0.5pt solid #ccc; box-shadow: none;
      background: #fff !important; border-radius: 0;
    }
    .day.tile.today { box-shadow: none; border-color: #999; }
    .day.tile.today .dnum b, .day.tile.today .dnum .dow { color: #000 !important; }
    .wkhead { margin: 6mm 0 2mm; }

    /* The shop is worth printing, but on its own page and in plain black. */
    .live-list {
      box-shadow: none; border: 0.5pt solid #ccc; border-radius: 0;
      background: #fff !important; break-before: page;
    }
    .live-head h3, .live-aisle h4, .live-check h4 { color: #000 !important; }
    .live-count, .live-shared { color: #666 !important; }
    .live-qty { font-size: 10pt; }
  }

  /* ================= the meal card =================
     Tapping a planned meal opens this. A bottom sheet on a phone (thumb reaches
     the top of it, and it reads as "this belongs to the thing I tapped"), a
     centred card on a desktop. */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(15,32,21,.5); backdrop-filter: blur(2px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; max-height: 94vh; /* narrow-ok: modal sheet */
    background: var(--card);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 40px rgba(15,32,21,.28);
    display: flex; flex-direction: column;
    animation: sheet-up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheet-up { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
  @media (min-width: 640px) {
    .sheet-backdrop { align-items: center; }
    .sheet { border-radius: 24px; max-height: 88vh; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .sheet-head {
    display: flex; align-items: flex-start; gap: 1rem;
    padding: 1.1rem 1.15rem .9rem; border-bottom: 1px solid var(--line); flex: none;
  }
  .sheet-title { min-width: 0; flex: 1; }
  .sheet-day {
    display: inline-block; font-size: .68rem; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--tag-ink); background: var(--tag-bg);
    border-radius: 999px; padding: .25rem .65rem;
  }
  .sheet-dish {
    font-size: 1.5rem; font-weight: 800; letter-spacing: -.025em;
    margin: .45rem 0 0; line-height: 1.12; overflow-wrap: anywhere;
  }
  .sheet-x { border-radius: 50%; width: 38px; height: 38px; padding: 0; flex: none; color: var(--muted); }
  .sheet-body { overflow-y: auto; padding: 1rem 1.15rem 1.4rem; -webkit-overflow-scrolling: touch; }
  .sheet-sec + .sheet-sec { margin-top: 1.35rem; }
  .sheet-h {
    font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 .5rem;
  }
  .sheet-h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .sheet-note { font-size: .8rem; color: var(--muted); margin: -.2rem 0 .7rem; line-height: 1.5; }
  .linky {
    background: none; border: 0; box-shadow: none; padding: 0; min-height: 0;
    color: var(--accent-dk); font-size: .82rem; font-weight: 700;
  }
  .linky:hover { background: none; transform: none; text-decoration: underline; }

  /* --- the per-day picker --- */
  .pick-group {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .7rem .75rem .8rem; margin-bottom: .55rem;
  }
  .pick-label { display: flex; align-items: center; gap: .45rem; font-size: .82rem; font-weight: 700; margin-bottom: .55rem; }
  .pick-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--tone); }
  .pick-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .pick-chip {
    font-size: .84rem; font-weight: 700; padding: .5rem .85rem; min-height: 38px;
    border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); color: var(--muted);
  }
  .pick-chip:hover { border-color: var(--tone); color: var(--ink); }
  .pick-chip.on {
    background: var(--tone); border-color: transparent; color: #fff;
    box-shadow: 0 2px 8px rgba(20,38,26,.18);
  }
  .tone-style { --tone: var(--g-style); }
  .tone-protein { --tone: var(--g-protein); }
  .tone-veg { --tone: var(--g-veg); }

  /* --- ingredients --- */
  .ing-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
  @media (min-width: 420px) { .ing-lines { grid-template-columns: 1fr 1fr; } }
  .ing-line {
    display: flex; align-items: center; gap: .55rem; font-size: .86rem; font-weight: 500;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: .5rem .6rem; width: 100%; text-align: left; min-height: 40px;
  }
  .ing-line:hover { border-color: var(--accent); box-shadow: none; }
  /* Switched off for this day: still listed, so you can put it back. */
  .ing-line.off { opacity: .55; }
  .ing-line.off span:last-child { text-decoration: line-through; }
  .ing-line.off .ing-tick { background: transparent; border: 1.5px solid var(--empty); }
  /* Lines contributed by a choice carry that group's colour, so picking peppers
     visibly puts peppers in the list rather than only lighting a chip. */
  .ing-line.from-pick { border-color: var(--tone); background: #fff; }
  .ing-line.from-pick .ing-tick { background: var(--tone); }
  .ing-tick {
    width: 19px; height: 19px; border-radius: 6px; background: var(--accent); color: #fff;
    display: grid; place-items: center; flex: none; font-size: .6rem;
  }
  .pick-chip.add { border-style: dashed; color: var(--muted); font-weight: 600; }
  .pick-chip.add:hover { border-style: solid; }
  .pick-add-in {
    font: inherit; font-size: .84rem; font-weight: 600; width: 9rem;
    padding: .45rem .8rem; min-height: 38px;
    border-radius: 999px; border: 1.5px solid var(--tone); background: var(--card);
  }
  .method { margin-top: .7rem; border-top: 1px solid var(--line); padding-top: .6rem; }
  .method summary { font-size: .82rem; font-weight: 700; color: var(--accent-dk); cursor: pointer; }
  .method-body { font-size: .86rem; line-height: 1.6; color: var(--ink); margin-top: .5rem; font-weight: 500; }

  /* --- fill it in / day actions --- */
  .fill-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: .4rem; }
  .fill-row button {
    flex-direction: column; gap: .25rem; font-size: .76rem; font-weight: 700;
    padding: .7rem .3rem; border-radius: var(--radius-sm);
    background: var(--tag-bg); border-color: transparent; color: var(--tag-ink);
  }
  .fill-row button:hover { background: #c6f6d5; }
  .fill-row svg.i { width: 1.25em; height: 1.25em; }
  .sheet-acts { display: flex; flex-wrap: wrap; gap: .4rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .sheet-acts button { font-size: .84rem; background: var(--bg); border-color: transparent; }
  .sheet-acts .danger { margin-left: auto; background: var(--danger-bg); }
</style>

</head>

  <script>
//// Menu Planner — client app (vanilla JS, no build step). ////

var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

// In-memory cache populated by getBootstrapData() and refreshed after writes.
// `pantry` is loaded lazily the first time the cupboard is opened, and set back to
// null whenever a write may have changed it.
var STATE = {
  meals: [], templates: [], rotations: [], overviewStart: null, overview: null,
  pantry: null, collections: [], userEmail: '', hasAi: false,
  // Weeks shown on the landing page. One by default — you plan the next week,
  // not the next month. Remembered across visits.
  span: 1
};
try {
  var savedSpan = Number(localStorage.getItem('mp.span'));
  if (savedSpan === 1 || savedSpan === 2 || savedSpan === 4) STATE.span = savedSpan;
} catch (e) { /* private browsing */ }

// The open per-meal popover on the Menu (its options, or its shelves).
var _mmenu = null;
function closeMealMenu() {
  if (!_mmenu) return;
  document.removeEventListener('pointerdown', _mmenu.outside, true);
  _mmenu.pop.remove();
  _mmenu = null;
}

// Menu multi-select: an ordered list of selected mealIds ("Add to week").
var MENU_SEL = [];

// Which shelves the menu is filtered to. Empty means everything. Several at once
// is an OR, not an AND — "show me the pastas and the curries" is the useful
// reading, and a dish on both shelves should appear once, not disappear.
var MENU_SHELVES = [];

//// --- server bridge ---------------------------------------------------- ////

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  showLoader(true);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) { showLoader(false); resolve(r); })
      .withFailureHandler(function (e) { showLoader(false); reject(e); })
      [fn].apply(google.script.run, args);
  });
}

// Like call() but without the full-screen loader — for frequent background
// writes (autosave) that shouldn't flash a spinner over the UI.
function callQuiet(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fn].apply(google.script.run, args);
  });
}

function showLoader(on) { qs('#loader').classList.toggle('hidden', !on); }

var _toastTimer = null;
function toast(msg, isErr) {
  var t = qs('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.remove('hidden');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 3200);
}

//// --- tiny DOM helpers ------------------------------------------------- ////

function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function bind(root, name) { return qs('[data-bind="' + name + '"]', root); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }
function el(tag, attrs, html) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
  if (html != null) n.innerHTML = html;
  return n;
}
function mountView(id) {
  var tpl = qs('#' + id);
  var node = tpl.content.firstElementChild.cloneNode(true);
  var host = qs('#view');
  host.innerHTML = '';
  host.appendChild(node);
  return node;
}
function fmtWeek(iso) {
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

//// --- router ----------------------------------------------------------- ////

function router() {
  closeMealPicker();
  closeUrlEditor();
  closeSlotMenu();
  var hash = location.hash.replace(/^#\/?/, '') || 'overview';
  var parts = hash.split('/');
  var route = parts[0];
  if (route !== 'shopping') closeShoppingList();
  qsa('#nav a').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('data-route') === route);
  });
  // Each view owns the topbar action slot; clear it before dispatching.
  var actions = qs('#view-actions');
  if (actions) { actions.innerHTML = ''; actions.onclick = null; }
  if (route === 'menu') return renderMenu();
  if (route === 'rotations') return renderRotations();
  // Shopping is a destination in its own right — you open it standing in a shop,
  // not while planning. It opens over the overview so closing it lands somewhere
  // useful, and defaults to the week you're actually shopping for.
  if (route === 'shopping') {
    renderOverview();
    openShoppingList(parts[1] || thisMonday(), { fromNav: true });
    return;
  }
  return renderOverview();
}

/** The Monday of the current week, matching the server's Monday-start weeks. */
function thisMonday() {
  var d = new Date();
  var day = d.getDay();                       // 0 = Sun
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return localIso(d);
}

//// --- overview --------------------------------------------------------- ////

// How many weeks the landing page shows. One is the default: opening on a whole
// month asked you to think about four weeks when you only ever plan the next
// one, and left no room for the shopping list underneath it.
var SPANS_ = [{ n: 1, label: 'Week' }, { n: 2, label: '2 weeks' }, { n: 4, label: 'Month' }];

function overviewActionsHtml() {
  return '<div class="span-toggle">' +
      SPANS_.map(function (s) {
        return '<button class="span-btn' + (STATE.span === s.n ? ' on' : '') +
          '" data-span="' + s.n + '">' + s.label + '</button>';
      }).join('') +
    '</div>' +
    '<button class="primary" data-act="randomise"><svg class="i"><use href="#ic-dice"/></svg> Fill empty</button>' +
    '<button class="ghost" data-act="clear-all">Clear all</button>' +
    '<button class="ghost" data-act="print"><svg class="i"><use href="#ic-print"/></svg> Print</button>' +
    '<button class="ghost" data-act="prev" title="Earlier"><svg class="i"><use href="#ic-chev-l"/></svg></button>' +
    '<button class="ghost" data-act="today">Today</button>' +
    '<button class="ghost" data-act="next" title="Later"><svg class="i"><use href="#ic-chev-r"/></svg></button>';
}

function renderOverview() {
  var node = mountView('view-overview');
  node.addEventListener('click', function (e) {
    if (liveListEdit(e)) return;
    var shop = e.target.closest('[data-shopweek]');
    if (shop) { openShoppingList(shop.getAttribute('data-shopweek')); return; }
    var wact = e.target.closest('[data-weekact]');
    if (wact) { weekAction(wact.getAttribute('data-weekact'), wact.getAttribute('data-week'), wact); return; }
    // Today's hero actions. They carry data-nostart so pointerDrag ignores them
    // entirely, which is why they arrive here as ordinary clicks.
    var hero = e.target.closest('[data-heroact]');
    if (hero) {
      var hcell = hero.closest('.day[data-week]');
      if (!hcell) return;
      var hweek = hcell.getAttribute('data-week');
      var hday = Number(hcell.getAttribute('data-day'));
      var hslots = ovDaySlots(hweek, hday);
      var cur = (hslots && hslots[0] && hslots[0].mealId) || '';
      if (hero.getAttribute('data-heroact') === 'change') {
        openMealPicker(hero, cur, function (id) { setOvHalf(hweek, hday, 0, id, ''); });
      }
      return;
    }
    var meal = e.target.closest('[data-livemeal]');
    if (meal) { highlightShopMeal(meal.closest('.live-list'), meal.getAttribute('data-livemeal')); return; }
    var fill = e.target.closest('[data-fill]');
    if (fill) { openMealCard(fill, { mealId: fill.getAttribute('data-fill'), refresh: function () { invalidateOverview(); loadOverview(); } }); return; }
  });
  var actions = qs('#view-actions');
  if (actions) {
    actions.innerHTML = overviewActionsHtml();
    actions.onclick = function (e) {
      var spanBtn = e.target.closest('[data-span]');
      if (spanBtn) return setSpan(Number(spanBtn.getAttribute('data-span')));
      var hit = e.target.closest('[data-act]');
      var act = hit && hit.getAttribute('data-act');
      if (!act) return;
      // Paging moves by whatever you're looking at, so Later always advances one
      // screenful rather than a fixed four weeks.
      if (act === 'prev') return shiftOverview(-STATE.span);
      if (act === 'next') return shiftOverview(STATE.span);
      if (act === 'today') { STATE.overviewStart = null; return loadOverview(); }
      if (act === 'randomise') return randomiseOverview(overviewSection());
      if (act === 'clear-all') return clearAllOverview(overviewSection());
      if (act === 'print') return window.print();
    };
  }
  if (STATE.overview) paintOverview(node); else loadOverview(node);
}

function setSpan(n) {
  if (STATE.span === n) return;
  STATE.span = n;
  try { localStorage.setItem('mp.span', String(n)); } catch (e) { /* private browsing */ }
  STATE.overview = null;
  renderOverview();
  loadOverview();
}

function loadOverview(node) {
  call('getOverview', STATE.overviewStart, STATE.span).then(function (ov) {
    STATE.overview = ov;
    STATE.overviewStart = ov.start;
    if (location.hash.indexOf('overview') !== -1 || location.hash === '' || location.hash === '#/') {
      paintOverview(node || qs('#view-overview-host') || qs('#view section'));
    }
  }).catch(function (e) { toast(errMsg(e), true); });
}

function shiftOverview(deltaWeeks) {
  var base = STATE.overviewStart || (STATE.overview && STATE.overview.start);
  call('getOverview', shiftIso(base, deltaWeeks * 7), STATE.span).then(function (ov) {
    STATE.overview = ov; STATE.overviewStart = ov.start; renderOverview();
  }).catch(function (e) { toast(errMsg(e), true); });
}

/** Template actions, moved up from the deleted week editor onto the week band. */
function weekAction(act, weekStart, anchor) {
  if (act === 'save-template') {
    var name = window.prompt('Save this week as a template called:', '');
    if (name === null || !String(name).trim()) return;
    call('saveWeekAsTemplate', weekStart, { name: String(name).trim() }).then(function (t) {
      STATE.templates = (STATE.templates || []).concat([t]);
      toast('Saved as ' + t.name);
    }).catch(function (e) { toast(errMsg(e), true); });
    return;
  }
  if (act === 'apply-template') {
    if (!(STATE.templates || []).length) { toast('No templates saved yet. Save a week first.'); return; }
    openTemplatePicker(anchor, weekStart);
  }
}

/** Small popover listing saved templates, applied to the week you tapped. */
var _tpick = null;
function closeTemplatePicker() {
  if (!_tpick) return;
  document.removeEventListener('pointerdown', _tpick.outside, true);
  _tpick.pop.remove();
  _tpick = null;
}
function openTemplatePicker(anchor, weekStart) {
  closeTemplatePicker();
  var pop = el('div', { 'class': 'mpick smenu' },
    STATE.templates.map(function (t) {
      return '<button class="smenu-item" data-tpl="' + esc(t.templateId) + '">' + esc(t.name) + '</button>';
    }).join(''));
  document.body.appendChild(pop);
  positionPopover(pop, anchor);
  pop.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tpl]');
    if (!b) return;
    var id = b.getAttribute('data-tpl');
    closeTemplatePicker();
    call('applyTemplateToWeek', id, weekStart, { overwrite: true }).then(function () {
      toast('Template applied');
      invalidateOverview();
      loadOverview();
    }).catch(function (err) { toast(errMsg(err), true); });
  });
  var outside = function (ev) { if (!pop.contains(ev.target)) closeTemplatePicker(); };
  _tpick = { pop: pop, outside: outside };
  setTimeout(function () { document.addEventListener('pointerdown', outside, true); }, 0);
}

function shiftIso(iso, days) {
  var d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  // localIso, NOT toISOString: the Date is local midnight, and toISOString
  // converts to UTC first — so anywhere ahead of UTC (like Sydney) it hands back
  // the previous day. That shifted every overview tile's date a day early and
  // made "Later →" advance three weeks instead of four.
  return localIso(d);
}

function mealById(id) {
  return id ? STATE.meals.filter(function (m) { return m.mealId === id; })[0] : null;
}

// --- variations -------------------------------------------------------------
// A "variation" is a meal whose parentId points at a base meal (e.g. "red
// curry, prawns" under "Curry"). These helpers keep the parent⇄child view in
// one place so labels read consistently as "Base: detail" everywhere.

/** Active variations (child meals) of a base meal, by parent id. */
function variationsOf(parentId) {
  return parentId
    ? STATE.meals.filter(function (m) { return m.parentId === parentId; })
    : [];
}

/** "Base: detail" for a variation, else the meal's own name. */
function mealDisplayName(meal) {
  if (!meal) return '';
  if (meal.parentId) {
    var base = mealById(meal.parentId);
    if (base) return base.name + ': ' + meal.name;
  }
  return meal.name;
}

/** Display label for a planned slot — live "Base: detail", else its snapshot. */
function slotDisplay(s) {
  if (!s) return '';
  var meal = mealById(s.mealId);
  return meal ? mealDisplayName(meal) : (s.mealName || '');
}

/** One overview meal line, with a ↻ badge when it's a no-cook leftovers day.
    The recipe's time used to ride along inline here; it now has its own column
    (.dtime) in both layouts, so the dish name is the only thing on its line. */
function ovSlotSpan(s) {
  var meal = mealById(s.mealId);
  var sp = (meal && meal.category === 'Special') ? ' sp' : '';
  var lo = s.leftover ? '<span class="lo-badge" title="Leftovers — no cooking">↻</span>' : '';
  return '<span class="nm' + sp + '">' + lo + esc(slotDisplay(s)) + '</span>';
}

/** The time for a day's own column — blank on a leftovers day (nothing to cook). */
function ovDayTime(day) {
  var s = day.slots[0];
  if (!s || s.leftover) return '';
  var meal = mealById(s.mealId);
  return meal ? timeBadge(meal.time, 'dtime') : '';
}

/** Dish name(s) for a day: one line, or two labelled halves for a split day. */
function ovDayBody(day) {
  if (!day.slots.length) return '<span class="nm">+ Add a meal</span>';
  if (day.slots.length >= 2) {
    return '<span class="split">' + day.slots.slice(0, 2).map(function (s) {
      return '<span class="half">' + ovHalfLabel(s) + ovSlotSpan(s) + '</span>';
    }).join('') + '</span>';
  }
  return ovSlotSpan(day.slots[0]);
}

/** The six-dot touch drag handle. Same job the ⠿ glyph did, without borrowing
    a character out of braille to do it. */
function gripHtml() {
  return '<span class="dgrip" data-grip aria-hidden="true">' +
    '<i></i><i></i><i></i><i></i><i></i><i></i></span>';
}

/** A week's own actions: template in, template out, and its full shopping list. */
function weekActsHtml(weekStart) {
  return '<div class="mb-acts">' +
    '<button type="button" class="mb-act" data-weekact="apply-template" data-week="' + esc(weekStart) +
      '" title="Apply a saved template to this week">Use template</button>' +
    '<button type="button" class="mb-act" data-weekact="save-template" data-week="' + esc(weekStart) +
      '" title="Save this week as a reusable template">Save week</button>' +
    '<button type="button" class="mb-act" data-shopweek="' + esc(weekStart) +
      '" title="Full shopping list for this week">' +
      '<svg class="i"><use href="#ic-cart"/></svg> Shop</button>' +
  '</div>';
}

/** Today's row carries the answer to "what are we eating tonight", so it also
    carries the two things you'd do next. data-nostart keeps pointerDrag off
    them, so they click instead of starting a drag or opening the meal card. */
function heroActsHtml(slot) {
  var meal = mealById(slot.mealId);
  var url = meal && meal.url;
  return '<span class="dacts">' +
    (url
      ? '<a class="btn-hero" href="' + esc(url) + '" target="_blank" rel="noopener" data-nostart>' +
          '<svg class="i"><use href="#ic-link"/></svg> Open recipe</a>'
      : '') +
    '<button type="button" class="btn-hero" data-heroact="change" data-nostart>' +
      '<svg class="i"><use href="#ic-swap"/></svg> Change meal</button>' +
  '</span>';
}

/** Small "Adults"/"Kids" tag for a split half (blank for an unlabelled manual split). */
function ovHalfLabel(s) {
  var t = s.role === 'adult' ? 'Adults' : s.role === 'kids' ? 'Kids' : '';
  return t ? '<span class="half-lbl">' + t + '</span>' : '';
}
function pad2(n) { return ('0' + n).slice(-2); }
function localIso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
var TODAY_ISO = localIso(new Date());

/**
 * The plan. Week and 2 weeks render as a menu board — the week set like a
 * printed menu, with today taking the hero — because that is the question the
 * page exists to answer. Month renders the same days as tiles instead: 28 rows
 * of display serif is handsome and far too long to scan.
 *
 * Both layouts put data-week/data-day on a .day element, which is what the drag
 * engine binds to, so press-and-drag to move or swap a day (across weeks
 * included) works identically in either.
 */
function paintOverview(node) {
  if (!node || !STATE.overview) return;
  var ov = STATE.overview;
  var host = bind(node, 'weeks');
  host.innerHTML = '';

  var asTiles = STATE.span >= 4;
  ov.weeks.forEach(function (w) {
    host.appendChild(asTiles ? tileWeekEl(w) : menuSheetEl(w));
  });

  armOverviewDrags(host, node);
  paintLiveList(host, ov);
}

/** One week as a menu-board sheet (Week and 2-week spans). */
function menuSheetEl(w) {
  var range = fmtWeek(w.weekStart) + ' – ' + fmtWeek(shiftIso(w.weekStart, 6));
  var sheet = el('section', { 'class': 'mb-sheet' },
    '<div class="mb-head">' +
      '<div class="mb-est">Week of</div>' +
      '<h2 class="mb-range">' + esc(range) + '</h2>' +
      (w.label ? '<div><span class="mb-lab">' + esc(w.label) + '</span></div>' : '') +
      weekActsHtml(w.weekStart) +
    '</div>');

  w.days.forEach(function (day, i) {
    var iso = shiftIso(w.weekStart, i);
    var isToday = iso === TODAY_ISO;
    var slot = day.slots[0];
    var cls = 'day mb-day' + (day.slots.length >= 2 ? ' is-split' : '') +
      (isToday ? ' today' : '') + (day.slots.length ? '' : ' empty');

    // The hero only makes sense when there is something to cook tonight; an
    // empty today is still just an invitation to fill it.
    var hero = isToday && slot;
    sheet.appendChild(el('div', {
      'class': cls, 'data-week': w.weekStart, 'data-day': i, 'data-touchgrip': ''
    },
      '<span class="dnum"><b>' + iso.slice(8, 10) + '</b><span class="dow">' + DOW[i] + '</span></span>' +
      '<span class="dbody">' +
        (hero ? '<span class="dkick">Tonight</span>' : '') +
        ovDayBody(day) +
        (hero ? heroActsHtml(slot) : '') +
      '</span>' +
      ovDayTime(day) +
      gripHtml()));
  });
  return sheet;
}

/** One week as a row of tiles (Month span). */
function tileWeekEl(w) {
  var wrap = el('div', {});
  wrap.appendChild(el('div', { 'class': 'wkhead' },
    '<h3>Week of ' + esc(fmtWeek(w.weekStart)) + '</h3>' +
    (w.label ? '<span class="lab">' + esc(w.label) + '</span>' : '') +
    '<span class="rule"></span>' +
    weekActsHtml(w.weekStart)));

  var grid = el('div', { 'class': 'tile-week' });
  w.days.forEach(function (day, i) {
    var iso = shiftIso(w.weekStart, i);
    var cls = 'day tile' + (day.slots.length >= 2 ? ' is-split' : '') +
      (iso === TODAY_ISO ? ' today' : '') + (day.slots.length ? '' : ' empty');
    grid.appendChild(el('div', {
      'class': cls, 'data-week': w.weekStart, 'data-day': i, 'data-touchgrip': ''
    },
      '<span class="dnum"><b>' + DOW[i] + '</b><span class="dow">' + iso.slice(8, 10) + '</span></span>' +
      ovDayBody(day) + ovDayTime(day) + gripHtml()));
  });
  wrap.appendChild(grid);
  return wrap;
}

/**
 * The week's shopping list, rendered under the plan and rebuilt whenever the plan
 * changes — so you can see the shop taking shape as you plan rather than having
 * to go and look for it.
 *
 * Shown at every span. In two- or four-week mode it covers the FIRST week on
 * screen and says so, because "what am I buying" only ever means one week.
 *
 * Editable in place: merging is a good guess, not gospel, so each line can be
 * crossed off or given a different quantity without hunting down the meal that
 * contributed it.
 */
function paintLiveList(host, ov) {
  if (!host || !ov || !ov.weeks || !ov.weeks.length) return;
  var weekStart = ov.weeks[0].weekStart;
  var panel = el('section', { 'class': 'live-list' },
    '<div class="live-head">' +
      '<h3><svg class="i"><use href="#ic-cart"/></svg> The shop</h3>' +
      '<span class="live-count" data-bind="liveCount">week of ' + esc(fmtWeek(weekStart)) + '</span>' +
      '<button class="ghost" data-shopweek="' + esc(weekStart) + '">Open full list</button>' +
    '</div>' +
    '<div data-bind="liveBody"><p class="muted">Working it out…</p></div>');
  host.appendChild(panel);

  var target = bind(panel, 'liveBody');
  // Quiet: this repaints on every plan edit and a full-screen spinner over the
  // planner each time would be worse than a moment of stale text.
  callQuiet('getShoppingList', weekStart).then(function (list) {
    if (!panel.isConnected) return;   // the view moved on while we waited
    LIVE_WEEK = weekStart;
    SHOP_CACHE[weekStart] = list;
    var byKey = {};
    list.items.forEach(function (i) { byKey[i.itemKey] = i; });
    var groups = list.aisles.filter(function (g) { return g.itemKeys.length; });
    var mealsByKey = itemMealMap(list);

    var countEl = bind(panel, 'liveCount');
    if (countEl) {
      countEl.textContent = 'week of ' + fmtWeek(weekStart) + ' · ' +
        list.items.length + (list.items.length === 1 ? ' item' : ' items');
    }

    var html = '';
    if (groups.length || list.pantry.length) {
      html += liveMealsHtml(shopMeals(list)) +
        '<div class="live-aisles">' +
        groups.map(function (g) {
          return liveAisle(g.aisle, g.itemKeys.map(function (k) { return byKey[k]; }), mealsByKey);
        }).join('') +
        (list.pantry.length ? liveAisle('Cupboard re-buys', list.pantry, mealsByKey) : '') +
      '</div>';
    } else {
      html += '<p class="muted">Nothing to buy yet. Plan some meals, then tap one to give it ingredients.</p>';
    }
    // What the week's cooking assumes is already in. Not bought, not hidden.
    if (list.checkPantry && list.checkPantry.length) {
      html += '<div class="live-check"><h4>Check the cupboard</h4><p>' +
        list.checkPantry.map(function (i) { return esc(i.label); }).join(' &middot; ') +
        '</p></div>';
    }
    html += missingHtml(list);
    target.innerHTML = html;
  }).catch(function () {
    if (panel.isConnected) target.innerHTML = '<p class="muted">Could not load the list.</p>';
  });
}

// The week the on-screen live list belongs to, so its edit handlers know which
// week they are editing without threading it through every element.
var LIVE_WEEK = null;

// Last-known list payload per week. The landing page has usually fetched this
// week's list already, so the shopping sheet can open showing it immediately
// and refresh quietly, instead of sitting blank through a server round-trip.
var SHOP_CACHE = {};

/**
 * itemKey \u2192 the meal ids that put it on the list.
 *
 * No new server work: getShoppingList already returns `meals`, the same items
 * grouped by planned day (svc_ShoppingList.js). This just inverts it.
 */
function itemMealMap(list) {
  var map = {};
  (list.meals || []).forEach(function (m) {
    (m.itemKeys || []).forEach(function (k) {
      if (!map[k]) map[k] = [];
      if (map[k].indexOf(m.mealId) === -1) map[k].push(m.mealId);
    });
  });
  return map;
}

/** The week's distinct meals, in plan order, each with the items it contributes.
    A meal cooked twice in a week is one chip: it wants the same shopping. */
function shopMeals(list) {
  var by = {}, order = [];
  (list.meals || []).forEach(function (m) {
    if (!m.mealId) return;
    if (!by[m.mealId]) { by[m.mealId] = { mealId: m.mealId, name: m.mealName, keys: [] }; order.push(m.mealId); }
    (m.itemKeys || []).forEach(function (k) {
      if (by[m.mealId].keys.indexOf(k) === -1) by[m.mealId].keys.push(k);
    });
  });
  return order.map(function (id) { return by[id]; });
}

/** The meal row above the list. One meal has nothing to be picked out of. */
function liveMealsHtml(meals) {
  if (meals.length < 2) return '';
  return '<div class="live-meals">' +
    meals.map(function (m) {
      return '<button type="button" class="live-mchip" data-livemeal="' + esc(m.mealId) + '">' +
        esc(m.name) + '<span class="n">' + m.keys.length + '</span></button>';
    }).join('') +
    '<button type="button" class="live-mchip all" data-livemeal="">Show all</button>' +
  '</div>';
}

function liveAisle(title, items, mealsByKey) {
  return '<div class="live-aisle"><h4>' + esc(title) + '</h4><ul>' +
    items.filter(Boolean).map(function (item) {
      var ms = (mealsByKey && mealsByKey[item.itemKey]) || [];
      return '<li class="live-item' + (item.checked ? ' done' : '') + '" data-item="' + esc(item.itemKey) +
        '" data-meals="' + esc(ms.join(' ')) + '">' +
        '<button type="button" class="live-qty' + (item.edited ? ' edited' : '') +
          '" data-liveqty="' + esc(item.itemKey) + '" title="Change the amount">' +
          esc(item.label) + '</button>' +
        // Shared between meals: a count, not the other meal's name. The names
        // wrap and shove the rows about; the number says "shared" and stays put.
        (ms.length > 1
          ? '<span class="live-shared" title="' + ms.length + ' meals this week want this">\u00d7' + ms.length + '</span>'
          : '') +
        '<button type="button" class="live-x" data-livehide="' + esc(item.itemKey) +
          '" title="Don\u2019t need this" aria-label="Remove">' +
          '<svg class="i"><use href="#ic-x"/></svg></button>' +
      '</li>';
    }).join('') +
  '</ul></div>';
}

/**
 * Tap a meal: its lines light up across the whole list and everything else
 * recedes without disappearing. Seeing one meal *inside* the week's shop is the
 * whole point \u2014 it answers "why am I buying three onions" without leaving the
 * page or losing the sense of how much you're buying overall. Tapping the same
 * meal again, or "Show all", clears it.
 */
function highlightShopMeal(panel, mealId) {
  if (!panel) return;
  var sel = (!mealId || panel.getAttribute('data-livesel') === mealId) ? '' : mealId;
  panel.setAttribute('data-livesel', sel);
  panel.classList.toggle('filtering', !!sel);

  qsa('.live-mchip', panel).forEach(function (c) {
    c.classList.toggle('on', !!sel && c.getAttribute('data-livemeal') === sel);
  });
  // Two markups, one behaviour: .live-aisle/.live-item under the plan,
  // .shop-group/.shop-item in the full shopping sheet.
  qsa('.live-aisle, .shop-group', panel).forEach(function (group) {
    var any = false;
    qsa('.live-item, .shop-item', group).forEach(function (li) {
      var hit = !!sel && (li.getAttribute('data-meals') || '').split(' ').indexOf(sel) > -1;
      li.classList.toggle('hit', hit);
      if (hit) any = true;
    });
    group.classList.toggle('has-hit', any);
  });
}

/** Cross an item off the week's list, or set a quantity by hand. */
function liveListEdit(e) {
  if (!LIVE_WEEK) return false;

  var hide = e.target.closest('[data-livehide]');
  if (hide) {
    var row = hide.closest('.live-item');
    if (row) row.remove();                       // optimistic: it's gone either way
    callQuiet('setShoppingItemHidden', LIVE_WEEK, hide.getAttribute('data-livehide'), true)
      .catch(function (err) { toast(errMsg(err), true); refreshLiveList(); });
    return true;
  }

  var qtyBtn = e.target.closest('[data-liveqty]');
  if (qtyBtn) {
    var current = qtyBtn.textContent.trim();
    var next = window.prompt('Amount for this item (leave blank to go back to the total worked out for you):', current);
    if (next === null) return true;
    callQuiet('setShoppingItemQty', LIVE_WEEK, qtyBtn.getAttribute('data-liveqty'), next.trim())
      .then(refreshLiveList)
      .catch(function (err) { toast(errMsg(err), true); });
    return true;
  }
  return false;
}

/** The planned meals contributing nothing, named rather than silently missing. */
function missingHtml(list) {
  if (!list.missing.length) return '';
  return '<p class="live-missing">No ingredients yet: ' +
    list.missing.map(function (m) {
      return '<button type="button" class="link-btn" data-fill="' + esc(m.mealId) + '">' +
        DOW[m.dayIndex] + ' ' + esc(m.mealName) + '</button>';
    }).join(', ') + '</p>';
}

/**
 * Make each overview day a direct drag target: press-and-drag to move/swap it
 * with any other day (even across weeks); a plain tap opens its action menu
 * (or the meal picker when the day is empty).
 */
function armOverviewDrags(host, node) {
  // .day[data-week] matches both layouts — the menu-board row and the Month
  // tile are the same element wearing a different class.
  qsa('.day[data-week]', host).forEach(function (cell) {
    var week = cell.getAttribute('data-week');
    var day = Number(cell.getAttribute('data-day'));
    pointerDrag(cell, {
      kind: 'ovday',
      label: function () {
        var w = ovWeek(week);
        var s = w && w.days[day].slots[0];
        return (s && s.mealId) ? slotDisplay(s) : (DOW[day] + ' · ' + fmtWeek(week));
      },
      onDrop: function (t) { moveOverviewDay(week, day, t.week, t.day, node); },
      onClick: function () { overviewCellTap(week, day, cell); }
    });
  });
}

function ovWeek(weekStart) {
  return STATE.overview
    ? STATE.overview.weeks.filter(function (w) { return w.weekStart === weekStart; })[0]
    : null;
}
function overviewSection() { return qs('#view section'); }

function ovPrimaryType() {
  return (STATE.overview && STATE.overview.slotTypes && STATE.overview.slotTypes[0]) || 'Dinner';
}
function ovDaySlots(week, day) {
  var w = ovWeek(week);
  return w ? w.days[day].slots : null;
}

/** Tap on an overview day: empty → pick; single → slot menu (+Split); split → half chooser. */
function overviewCellTap(week, day, cell) {
  var slots = ovDaySlots(week, day);
  if (!slots) return;
  if (!slots.length) {
    openMealPicker(cell, '', function (id) { setOvHalf(week, day, 0, id, ''); });
    return;
  }
  if (slots.length >= 2) { openHalfChooser(cell, week, day); return; }

  var slot = slots[0];
  openMealCard(cell, {
    mealId: slot.mealId,
    day: { weekStart: week, dayIndex: day, slotType: slot.slotType || 'Dinner', role: slot.role || '' },
    onChange: function (a, opts) {
      openMealPicker(a || cell, slot.mealId, function (id) { setOvHalf(week, day, 0, id, slot.role || ''); }, opts);
    },
    onSplit: function (a) {
      openMealPicker(a || cell, '', function (id) { setOvHalf(week, day, 1, id, ''); });
    },
    onRemove: function () { setOvHalf(week, day, 0, null); },
    refresh: function () { paintOverview(overviewSection()); }
  });
}

/** A two-half day: choose which half to edit, or merge back to one meal. */
function openHalfChooser(anchor, week, day) {
  var slots = ovDaySlots(week, day);
  if (!slots) return;
  closeSlotMenu();
  var rows = slots.slice(0, 2).map(function (s, pos) {
    var lbl = s.role === 'adult' ? 'Adults' : s.role === 'kids' ? 'Kids' : ('Meal ' + (pos + 1));
    return '<button class="smenu-item" data-half="' + pos + '"><span class="smenu-ic">' +
      (pos === 0 ? '①' : '②') + '</span>' + esc(lbl) + ': ' + esc(slotDisplay(s)) + '</button>';
  });
  rows.push('<button class="smenu-item" data-half="merge"><span class="smenu-ic">⊟</span>Merge to one meal</button>');
  var pop = el('div', { 'class': 'mpick smenu' }, rows.join(''));
  document.body.appendChild(pop);
  positionPopover(pop, anchor);
  pop.addEventListener('click', function (e) {
    var b = e.target.closest('[data-half]');
    if (!b) return;
    var which = b.getAttribute('data-half');
    closeSlotMenu();
    if (which === 'merge') { setOvHalf(week, day, 1, null); return; }
    openHalfMenu(anchor, week, day, Number(which));
  });
  var outside = function (ev) { if (!pop.contains(ev.target)) closeSlotMenu(); };
  var key = function (ev) { if (ev.key === 'Escape') closeSlotMenu(); };
  _smenu = { pop: pop, outside: outside, key: key };
  setTimeout(function () {
    document.addEventListener('pointerdown', outside, true);
    document.addEventListener('keydown', key, true);
  }, 0);
}

/** The standard change/recipe/remove menu, scoped to one half of a split day. */
function openHalfMenu(anchor, week, day, pos) {
  var slots = ovDaySlots(week, day);
  var slot = slots && slots[pos];
  if (!slot) return;
  openMealCard(anchor, {
    mealId: slot.mealId,
    day: { weekStart: week, dayIndex: day, slotType: slot.slotType || 'Dinner', role: slot.role || '' },
    onChange: function (a, opts) {
      openMealPicker(a || anchor, slot.mealId, function (id) { setOvHalf(week, day, pos, id, slot.role || ''); }, opts);
    },
    onRemove: function () { setOvHalf(week, day, pos, null); },
    refresh: function () { paintOverview(overviewSection()); }
  });
}

/**
 * Set/replace/clear one half of an overview day (position 0 or 1), then persist.
 * Removing a half re-numbers the remaining slot back to a single tile.
 */
function setOvHalf(week, day, position, mealId, role) {
  var slots = ovDaySlots(week, day);
  if (!slots) return;
  if (mealId) {
    var meal = mealById(mealId);
    slots[position] = {
      slotType: ovPrimaryType(), mealId: mealId, mealName: meal ? meal.name : '',
      position: position, role: role || '', leftover: false
    };
  } else if (position < slots.length) {
    slots.splice(position, 1);
  }
  slots.forEach(function (s, i) { s.position = i; }); // keep positions contiguous
  paintOverview(overviewSection());
  callQuiet('saveWeekSlots', week, ovWeekPayload(week)).then(function () {
    // The live list is built server-side from the saved plan, so it can only be
    // refreshed once the save has landed — repainting before this point would
    // show the shop for the previous arrangement.
    refreshLiveList();
  }).catch(function (e) {
    toast(errMsg(e), true); invalidateOverview(); loadOverview();
  });
}

/**
 * Repaint just the shopping list under the plan, debounced. Tapping through a
 * few choices in a meal card fires this repeatedly, and each one is a round trip.
 */
var _liveTimer = null;
function refreshLiveList() {
  clearTimeout(_liveTimer);
  _liveTimer = setTimeout(function () {
    var existing = qs('.live-list');
    // No list on screen means we're not on the planner — nothing to refresh.
    if (!existing || !STATE.overview) return;
    var host = existing.parentNode;
    existing.remove();
    paintLiveList(host, STATE.overview);
  }, 350);
}

/** Flatten one overview week's days back into a saveWeekSlots payload. */
function ovWeekPayload(week) {
  var w = ovWeek(week);
  var out = [];
  if (!w) return out;
  var primary = ovPrimaryType();
  w.days.forEach(function (day, di) {
    day.slots.forEach(function (s, pos) {
      if (s.mealId) out.push({
        dayIndex: di, slotType: s.slotType || primary, mealId: s.mealId,
        role: s.role || '', leftover: !!s.leftover, position: pos
      });
    });
  });
  return out;
}

/** Optimistically swap two overview days, then persist (refetch on failure). */
function moveOverviewDay(fromWeek, fromDay, toWeek, toDay, node) {
  if (fromWeek === toWeek && fromDay === toDay) return;
  var ov = STATE.overview;
  if (!ov) return;
  var wA = ov.weeks.filter(function (w) { return w.weekStart === fromWeek; })[0];
  var wB = ov.weeks.filter(function (w) { return w.weekStart === toWeek; })[0];
  if (!wA || !wB) return;
  var tmp = wA.days[fromDay].slots;
  wA.days[fromDay].slots = wB.days[toDay].slots;
  wB.days[toDay].slots = tmp;
  paintOverview(node);

  callQuiet('moveOverviewDay', fromWeek, fromDay, toWeek, toDay)
    .catch(function (e) {
      toast(errMsg(e), true);
      invalidateOverview();
      loadOverview(node);
    });
}

/** Fill every empty slot across the shown weeks with random meals. */
function randomiseOverview(node) {
  var start = STATE.overviewStart || (STATE.overview && STATE.overview.start);
  call('randomFillOverview', start).then(function (res) {
    STATE.overview = res.overview;
    STATE.overviewStart = res.overview.start;
    paintOverview(node);
    if (res.unfilledWeekend) {
      toast(res.unfilledWeekend + ' day' + (res.unfilledWeekend === 1 ? '' : 's') +
        ' left empty — not enough meals match (try adding weekend meals)', true);
    } else {
      toast(res.added
        ? 'Filled ' + res.added + ' empty slot' + (res.added === 1 ? '' : 's')
        : 'No empty slots to fill');
    }
  }).catch(function (e) { toast(errMsg(e), true); });
}

/** Clear all meals across the shown weeks, after confirmation. */
function clearAllOverview(node) {
  var ov = STATE.overview;
  if (!ov) return;
  var any = ov.weeks.some(function (w) {
    return w.days.some(function (d) { return d.slots.length; });
  });
  if (!any) { toast('Nothing to clear'); return; }
  if (!confirm('Clear all meals in these 4 weeks? This can’t be undone.')) return;
  var start = STATE.overviewStart || ov.start;
  call('clearOverview', start).then(function (fresh) {
    STATE.overview = fresh;
    STATE.overviewStart = fresh.start;
    paintOverview(node);
    toast('Cleared all meals');
  }).catch(function (e) { toast(errMsg(e), true); });
}

//// --- menu ------------------------------------------------------------- ////

/**
 * Draft a recipe for every meal that has none. The server does them in batches
 * because each one is an API call of a few seconds and Apps Script caps a single
 * run at six minutes; this just keeps asking for another batch until it reports
 * nothing left.
 */
function draftMissingRecipes() {
  call('countMissingRecipes').then(function (n) {
    if (!n) { toast('Every meal already has a recipe.'); return; }
    var ok = window.confirm(
      'Draft ' + n + ' missing recipe' + (n === 1 ? '' : 's') + '?\n\n' +
      'This uses your Anthropic API key — a fraction of a cent each. They are ' +
      'first drafts: worth reading before you shop from them.\n\n' +
      'It runs in batches. Whatever finishes is saved, so stopping part-way is fine.');
    if (!ok) return;
    draftBatch(n, 0);
  }).catch(function (e) { toast(errMsg(e), true); });
}

function draftBatch(total, done) {
  toast('Drafting recipes… ' + done + ' of ' + total);
  call('bulkFillMissingRecipes', 6).then(function (filled) {
    done += filled;
    // A batch that fills nothing means the rest are failing, not that we're
    // finished — stop rather than loop forever on the same meals.
    if (filled > 0 && done < total) { draftBatch(total, done); return; }
    call('getMeals').then(function (meals) {
      STATE.meals = meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
      invalidateOverview();
      renderMenu();
      toast(done
        ? 'Drafted ' + done + ' recipe' + (done === 1 ? '' : 's') + '. Worth a read before you shop.'
        : 'Nothing could be drafted — check the API key.');
    });
  }).catch(function (e) { toast(errMsg(e), true); });
}

/**
 * Bulk import: paste any number of recipe URLs, get a meal per URL with its
 * name, ingredients, method and time read from each page. The server does a
 * batch per call (Apps Script caps a run at six minutes) and hands back what's
 * left; this keeps sending the remainder until nothing is.
 */
function importUrlsFlow() {
  var backdrop = el('div', { 'class': 'modal-backdrop' },
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' +
        '<h3 class="modal-title"><svg class="i"><use href="#ic-link"/></svg> Add meals from URLs</h3>' +
        '<button class="modal-x ghost" data-act="close" title="Close">×</button>' +
      '</div>' +
