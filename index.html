      '<p class="muted" style="font-size:.85rem; margin:0 0 .6rem">Paste recipe links, one per ' +
        'line (straight from a WhatsApp thread or your bookmarks is fine). Each one becomes a ' +
        'meal with its ingredients, method and time read from the page. Links your menu already ' +
        'has are skipped.</p>' +
      '<textarea data-bind="urls" rows="7" placeholder="https://…&#10;https://…" ' +
        'style="font-size:.85rem; font-family:inherit"></textarea>' +
      '<div class="import-log hidden" data-bind="log"></div>' +
      '<div class="row modal-foot">' +
        '<span class="muted" style="font-size:.82rem" data-bind="status"></span>' +
        '<div class="spacer"></div>' +
        '<button type="button" class="ghost" data-act="close">Close</button>' +
        '<button type="button" class="primary" data-act="go">Import</button>' +
      '</div>' +
    '</div>');
  document.body.appendChild(backdrop);
  var urlsEl = bind(backdrop, 'urls');
  var logEl = bind(backdrop, 'log');
  var statusEl = bind(backdrop, 'status');
  var goBtn = qs('[data-act="go"]', backdrop);
  var running = false;
  urlsEl.focus();

  function close() {
    if (running && !window.confirm('Importing is still running — close anyway? ' +
      'Whatever has finished is saved.')) return;
    backdrop.remove();
  }

  function logLine(html) {
    logEl.classList.remove('hidden');
    var div = document.createElement('div');
    div.innerHTML = html;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function finish(done, failed) {
    running = false;
    goBtn.disabled = false;
    statusEl.textContent = '';
    call('getMeals').then(function (meals) {
      STATE.meals = meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
      invalidateOverview();
      if (location.hash.indexOf('menu') !== -1) renderMenu();
      logLine('<strong>' + done + ' added' + (failed ? ', ' + failed + ' failed' : '') +
        '.</strong>' + (done ? ' They’re on the menu — <strong>Organise menu</strong> will shelve them.' : ''));
    });
  }

  function step(remaining, done, failed, total) {
    statusEl.textContent = 'Importing… ' + (total - remaining.length) + ' of ' + total;
    callQuiet('importRecipesFromUrls', remaining).then(function (res) {
      (res.results || []).forEach(function (r) {
        done += r.ok && !r.skipped ? 1 : 0;
        failed += r.ok ? 0 : 1;
        logLine(r.ok
          ? (r.skipped ? '⏭ Already on the menu: ' + esc(r.name)
                       : '✓ ' + esc(r.name) + timeBadge((mealById(r.mealId) || {}).time, 'nm-time'))
          : '✗ <span class="muted">' + esc(r.url) + '</span> — ' + esc(r.error));
      });
      if (res.remaining && res.remaining.length) { step(res.remaining, done, failed, total); return; }
      finish(done, failed);
    }).catch(function (e) {
      logLine('✗ ' + esc(errMsg(e)));
      finish(done, failed);
    });
  }

  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) { close(); return; }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    if (act.getAttribute('data-act') === 'close') { close(); return; }
    if (act.getAttribute('data-act') === 'go' && !running) {
      var urls = uniq(String(urlsEl.value || '').split(/\s+/)
        .map(function (u) { return u.trim(); })
        .filter(function (u) { return /^https?:\/\//i.test(u); }));
      if (!urls.length) { toast('Paste at least one full URL (starting with http).', true); return; }
      running = true;
      goBtn.disabled = true;
      logEl.innerHTML = '';
      step(urls, 0, 0, urls.length);
    }
  });
}

/**
 * Sort every meal onto shelves. One AI call for the whole menu, because the
 * judgements have to be consistent with each other — meal-by-meal calls drift.
 */
function organiseMenu() {
  var n = STATE.meals.filter(function (m) { return m.category !== 'Special'; }).length;
  if (!window.confirm(
    'Sort all ' + n + ' meals onto shelves (Pasta, Curry, Nagi, Asian and so on)?\n\n' +
    'This rewrites the tags on your meals and uses one API call for the lot. ' +
    'You can change any of them afterwards on the meal itself.')) return;
  call('autoTagMeals').then(function (res) {
    return call('getMeals').then(function (meals) {
      STATE.meals = meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
      MENU_SHELVES = [];
      renderMenu();
      toast('Sorted ' + res.tagged + ' meal' + (res.tagged === 1 ? '' : 's') + ' onto shelves.');
    });
  }).catch(function (e) { toast(errMsg(e), true); });
}

function renderMenu() {
  var node = mountView('view-menu');
  var form = bind(node, 'form');
  var search = bind(node, 'search');
  var catFilter = bind(node, 'catFilter');
  var selBar = bind(node, 'selectBar');
  var weekPick = bind(node, 'weekPick');

  // Drop any selected ids that no longer exist (e.g. archived since last visit).
  MENU_SEL = MENU_SEL.filter(function (id) {
    return STATE.meals.some(function (m) { return m.mealId === id; });
  });

  var cats = uniq(STATE.meals.map(function (m) { return m.category; }).filter(Boolean));
  catFilter.innerHTML = '<option value="">All categories</option>' +
    cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');

  var shelfHost = bind(node, 'shelves');

  function mealTags(m) {
    return String(m.tags || '').split(',')
      .map(function (t) { return t.trim().toLowerCase(); })
      .filter(function (t) { return t; });
  }

  /**
   * One chip per shelf that actually has something on it, in the curated order,
   * then anything else anyone has tagged by hand. A chip that filters to nothing
   * is clutter, so empty shelves are left out entirely.
   */
  function paintShelves() {
    var counts = {};
    STATE.meals.forEach(function (m) {
      mealTags(m).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });

    // ONLY the curated shelves. Showing every tag anyone had ever typed turned
    // the legacy seed tags — beef, chicken, pork, rice, pizza — into shelves,
    // which is sorting by protein: it matches a third of the menu and decides
    // nothing. Stale tags stay in the data harmlessly until Organise rewrites
    // them; they just aren't offered as a way to browse.
    var known = (STATE.collections || []).filter(function (c) { return counts[c.slug]; });

    if (!known.length) {
      shelfHost.innerHTML = '<p class="muted" style="font-size:.82rem; margin:.1rem 0 .6rem">' +
        'No shelves yet \u2014 <strong>Organise menu</strong> sorts every meal onto them so you ' +
        'can browse by pasta, curry, Nagi and so on.</p>';
      return;
    }

    shelfHost.innerHTML =
      '<button type="button" class="shelf' + (MENU_SHELVES.length ? '' : ' on') + '" data-shelf="">' +
        'All <span class="shelf-n">' + STATE.meals.length + '</span></button>' +
      known.map(function (c) {
        return '<button type="button" class="shelf' +
          (MENU_SHELVES.indexOf(c.slug) !== -1 ? ' on' : '') + '" data-shelf="' + esc(c.slug) + '">' +
          esc(c.label) + ' <span class="shelf-n">' + counts[c.slug] + '</span></button>';
      }).join('');
  }

  // Target-week dropdown: the weeks currently shown on the overview.
  var weeks = (STATE.overview && STATE.overview.weeks) || [];
  weekPick.innerHTML = weeks.map(function (w) {
    return '<option value="' + esc(w.weekStart) + '">Week of ' + esc(fmtWeek(w.weekStart)) + '</option>';
  }).join('');

  function paintSelBar() {
    var n = MENU_SEL.length;
    selBar.classList.toggle('hidden', n === 0);
    bind(node, 'selCount').textContent = n + ' selected';
  }

  /**
   * One meal. Tapping the card selects it for a week; everything else you can do
   * lives behind the single "..." button.
   *
   * It used to carry five separate controls — a book, a link, a pencil, a cog
   * and a cross — plus its shelves, none of which said what they did. A dish you
   * already know is Italian doesn't need telling; what you need is a way in.
   */
  function mealCard(m) {
    var selected = MENU_SEL.indexOf(m.mealId) !== -1;
    var hasRecipe = !!(m.ingredients || m.steps);
    return el('div',
      { 'class': 'meal' + (selected ? ' selected' : '') + (m.parentId ? ' meal-var' : ''), 'data-select': esc(m.mealId) },
      '<div class="meal-top">' +
        '<span class="name">' + mealLabel(m.mealId, mealDisplayName(m)) + '</span>' +
        '<button class="meal-more" data-more="' + esc(m.mealId) + '" ' +
          'title="What you can do with this meal" aria-label="Meal options">' +
          '<svg class="i"><use href="#ic-more"/></svg></button>' +
      '</div>' +
      // A dot for "has a recipe" earns its space; the shelves do not.
      (hasRecipe ? '' : '<span class="meal-norecipe">No recipe yet</span>') +
      timeBadge(m.time, 'meal-time') +
      mealFlagBadges(m) +
      '<div class="check" aria-hidden="true"><svg class="i"><use href="#ic-check"/></svg></div>');
  }

  /** Everything you can do with a meal, in one place instead of five icons. */
  function openMealMenu(anchor, mealId) {
    closeMealMenu();
    var m = mealById(mealId);
    if (!m) return;
    var items = [
      ['recipe', 'ic-book', (m.ingredients || m.steps) ? 'Recipe &amp; ingredients' : 'Add ingredients'],
      ['shelves', 'ic-list', 'Shelves'],
      ['edit', 'ic-swap', 'Edit meal details'],
      ['url', 'ic-link', m.url ? 'Change recipe link' : 'Add a recipe link']
    ];
    if (m.url) items.push(['open', 'ic-share', 'Open the recipe']);
    var pop = el('div', { 'class': 'mpick smenu' },
      items.map(function (it) {
        return '<button class="smenu-item" data-mm="' + it[0] + '">' +
          '<svg class="i"><use href="#' + it[1] + '"/></svg>' + it[2] + '</button>';
      }).join('') +
      '<button class="smenu-item danger" data-mm="archive">' +
        '<svg class="i"><use href="#ic-trash"/></svg>Archive meal</button>');
    document.body.appendChild(pop);
    positionPopover(pop, anchor);
    pop.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-mm]');
      if (!b) return;
      var what = b.getAttribute('data-mm');
      closeMealMenu();
      if (what === 'recipe') return openMealCard(anchor, { mealId: mealId, refresh: renderMenu });
      if (what === 'shelves') return openShelfEditor(anchor, mealId);
      if (what === 'edit') return openMealForm(mealId);
      if (what === 'open') return window.open(m.url, '_blank', 'noopener');
      if (what === 'url') {
        return openUrlEditor(anchor, m.url || '', function (url) {
          call('updateMeal', mealId, { url: url }).then(function (updated) {
            m.url = updated.url;
            toast(url ? 'Recipe link saved' : 'Recipe link removed');
            // A fresh link on a meal with no recipe: open the card and offer
            // to read the page, instead of leaving the link sitting unused.
            if (updated.url && !String(m.ingredients || '').trim() && !String(m.steps || '').trim()) {
              openMealCard(anchor, { mealId: mealId, refresh: renderMenu, autoImport: true });
            }
          }).catch(function (err) { toast(errMsg(err), true); });
        });
      }
      if (what === 'archive') {
        if (!window.confirm('Archive "' + m.name + '"? Planned weeks keep it.')) return;
        call('archiveMeal', mealId).then(function () {
          STATE.meals = STATE.meals.filter(function (x) { return x.mealId !== mealId; });
          MENU_SEL = MENU_SEL.filter(function (id) { return id !== mealId; });
          renderMenu();
          toast('Meal archived');
        }).catch(function (err) { toast(errMsg(err), true); });
      }
    });
    var outside = function (ev) { if (!pop.contains(ev.target)) closeMealMenu(); };
    _mmenu = { pop: pop, outside: outside };
    setTimeout(function () { document.addEventListener('pointerdown', outside, true); }, 0);
  }

  /** Which shelves a meal sits on — off the card face, one tap away. */
  function openShelfEditor(anchor, mealId) {
    closeMealMenu();
    var m = mealById(mealId);
    if (!m) return;
    var chosen = mealTags(m);
    var pop = el('div', { 'class': 'mpick shelf-edit' },
      '<div class="shelf-edit-h">Shelves for ' + esc(m.name) + '</div>' +
      '<div class="shelf-edit-chips">' +
        (STATE.collections || []).map(function (c) {
          return '<button type="button" class="shelf' + (chosen.indexOf(c.slug) !== -1 ? ' on' : '') +
            '" data-toggle="' + esc(c.slug) + '">' + esc(c.label) + '</button>';
        }).join('') +
      '</div>');
    document.body.appendChild(pop);
    positionPopover(pop, anchor);
    pop.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-toggle]');
      if (!b) return;
      var slug = b.getAttribute('data-toggle');
      var i = chosen.indexOf(slug);
      if (i === -1) chosen.push(slug); else chosen.splice(i, 1);
      b.classList.toggle('on', i === -1);
      callQuiet('updateMeal', mealId, { tags: chosen.join(',') }).then(function (updated) {
        m.tags = updated.tags;
      }).catch(function (err) { toast(errMsg(err), true); });
    });
    var outside = function (ev) {
      if (pop.contains(ev.target)) return;
      closeMealMenu();
      renderMenu();          // sections and counts move when shelves change
    };
    _mmenu = { pop: pop, outside: outside };
    setTimeout(function () { document.addEventListener('pointerdown', outside, true); }, 0);
  }

  // Small badges showing a meal's auto-fill rules at a glance.
  function mealFlagBadges(m) {
    var b = [];
    if (m.placement === 'weekday') b.push('<span class="mflag wd">Weekdays</span>');
    if (m.placement === 'weekend') b.push('<span class="mflag we">Weekends</span>');
    if (m.leftovers) b.push('<span class="mflag lo">↻ Leftovers</span>');
    if (m.parentsOnly) b.push('<span class="mflag po">Parents only</span>');
    return b.length ? '<div class="mflags">' + b.join('') + '</div>' : '';
  }

  function paint() {
    var q = (search.value || '').toLowerCase();
    var cat = catFilter.value;
    var list = bind(node, 'list');
    function keep(m) {
      var hay = (m.name + ' ' + m.tags + ' ' + m.category).toLowerCase();
      if (q && hay.indexOf(q) === -1) return false;
      if (cat && m.category !== cat) return false;
      if (!MENU_SHELVES.length) return true;
      // A variation is displayed under its base, so it inherits the base's
      // shelves — otherwise filtering to Curry would orphan "Thai green".
      var tags = mealTags(m);
      if (m.parentId) {
        var base = mealById(m.parentId);
        if (base) tags = tags.concat(mealTags(base));
      }
      return MENU_SHELVES.some(function (slug) { return tags.indexOf(slug) !== -1; });
    }
    // Group: each kept base, immediately followed by its kept variations, so
    // related dishes (Curry + its variations) sit together and read indented.
    var rows = [];
    STATE.meals.filter(function (m) { return !m.parentId && keep(m); }).forEach(function (base) {
      rows.push(base);
      variationsOf(base.mealId).filter(keep).forEach(function (k) { rows.push(k); });
    });
    // Orphan variations (parent filtered out or archived) still surface on their own.
    STATE.meals.filter(function (m) {
      return m.parentId && keep(m) && rows.indexOf(m) === -1;
    }).forEach(function (m) { rows.push(m); });

    if (!rows.length) { list.innerHTML = '<p class="muted">No meals match.</p>'; return; }

    // Sections, not one alphabetical wall. Each meal appears ONCE, under the
    // first shelf it belongs to in the curated order — a home, not a copy in
    // every shelf it touches, which would triple the length of the page. The
    // chips still find it by any of its shelves.
    var order = STATE.collections || [];
    var buckets = {};
    rows.forEach(function (m) {
      var home = primaryShelf(m);
      var key = home ? home.slug : '';
      (buckets[key] = buckets[key] || []).push(m);
    });

    var html = '';
    order.forEach(function (c) {
      if (!buckets[c.slug]) return;
      html += '<h3 class="shelf-head">' + esc(c.label) +
        '<span class="shelf-head-n">' + buckets[c.slug].length + '</span></h3>' +
        '<div class="meal-grid" data-bucket="' + esc(c.slug) + '"></div>';
    });
    if (buckets['']) {
      html += '<h3 class="shelf-head">Not shelved yet' +
        '<span class="shelf-head-n">' + buckets[''].length + '</span></h3>' +
        '<div class="meal-grid" data-bucket=""></div>';
    }
    list.innerHTML = html;
    Object.keys(buckets).forEach(function (key) {
      var grid = qs('[data-bucket="' + key + '"]', list);
      if (grid) buckets[key].forEach(function (m) { grid.appendChild(mealCard(m)); });
    });
  }

  /**
   * A meal's home section: the first shelf it has, in the curated order. A
   * variation lives with its base so "Curry: Thai green" doesn't drift away from
   * "Curry".
   */
  function primaryShelf(m) {
    var tags = mealTags(m);
    if (m.parentId) {
      var base = mealById(m.parentId);
      if (base) tags = tags.concat(mealTags(base));
    }
    var order = STATE.collections || [];
    // Only a cuisine shelf can be a home. Labels like Classics, Nagi and Batch
    // cook cut across cuisines, so filing by them put carbonara under Classics
    // and a curry under Classics and everything else nowhere useful.
    for (var i = 0; i < order.length; i++) {
      if (order[i].kind === 'home' && tags.indexOf(order[i].slug) !== -1) return order[i];
    }
    // Nothing but labels: better under "Nagi" than under "Not shelved yet".
    for (var j = 0; j < order.length; j++) {
      if (tags.indexOf(order[j].slug) !== -1) return order[j];
    }
    return null;
  }

  search.addEventListener('input', paint);
  catFilter.addEventListener('change', paint);

  node.addEventListener('click', function (e) {
    var shelf = e.target.closest('[data-shelf]');
    if (shelf) {
      var slug = shelf.getAttribute('data-shelf');
      if (!slug) MENU_SHELVES = [];                       // the "All" chip
      else if (MENU_SHELVES.indexOf(slug) !== -1) {
        MENU_SHELVES = MENU_SHELVES.filter(function (x) { return x !== slug; });
      } else MENU_SHELVES = MENU_SHELVES.concat([slug]);
      paintShelves();
      paint();
      return;
    }
    var more = e.target.closest('[data-more]');
    if (more) { openMealMenu(more, more.getAttribute('data-more')); return; }
    var act = e.target.getAttribute('data-act');
    if (act === 'organise') return organiseMenu();
    if (act === 'draft-all') return draftMissingRecipes();
    if (act === 'import-urls') return importUrlsFlow();
    if (act === 'add') { openMealForm(null); return; }
    if (act === 'cancel') { closeMealForm(); return; }
    if (act === 'clear-sel') { MENU_SEL = []; paint(); paintSelBar(); return; }
    if (act === 'add-to-week') { addSelectionToWeek(weekPick.value); return; }


    // Otherwise: clicking a card toggles its selection (links/buttons handled above).
    if (e.target.closest('a')) return;
    var selCard = e.target.closest('[data-select]');
    if (selCard) {
      var id = selCard.getAttribute('data-select');
      var at = MENU_SEL.indexOf(id);
      if (at === -1) MENU_SEL.push(id); else MENU_SEL.splice(at, 1);
      selCard.classList.toggle('selected', at === -1);
      paintSelBar();
    }
  });

  function addSelectionToWeek(weekStart) {
    if (!MENU_SEL.length) { toast('Select some meals first.', true); return; }
    if (!weekStart) { toast('Pick a week to add to.', true); return; }
    call('addMealsToWeek', weekStart, MENU_SEL.slice()).then(function (res) {
      MENU_SEL = [];
      invalidateOverview();
      var msg = 'Added ' + res.added + ' meal' + (res.added === 1 ? '' : 's');
      if (res.overflow) msg += ' — ' + res.overflow + ' didn’t fit (week is full)';
      toast(msg);
      location.hash = '#/week/' + weekStart;
    }).catch(function (err) { toast(errMsg(err), true); });
  }

  paintSelBar();

  // The card form does double duty: editingId === null means "add", otherwise
  // it patches that existing meal.
  var editingId = null;

  function openMealForm(mealId) {
    editingId = mealId || null;
    var m = editingId ? mealById(editingId) : null;
    form.reset();
    form.elements.name.value = m ? (m.name || '') : '';
    form.elements.category.value = m ? (m.category || 'Dinner') : 'Dinner';
    form.elements.tags.value = m ? (m.tags || '') : '';
    form.elements.placement.value = m ? (m.placement || '') : '';
    form.elements.time.value = m && m.time ? m.time : '';
    form.elements.leftovers.checked = !!(m && m.leftovers);
    form.elements.parentsOnly.checked = !!(m && m.parentsOnly);
    form.elements.url.value = m ? (m.url || '') : '';
    form.elements.description.value = m ? (m.description || '') : '';
    bind(node, 'formTitle').textContent = m ? ('Edit “' + mealDisplayName(m) + '”') : 'Add a meal';
    bind(node, 'formSubmit').textContent = m ? 'Save changes' : 'Save meal';
    form.classList.remove('hidden');
    form.elements.name.focus();
  }

  function closeMealForm() {
    editingId = null;
    form.reset();
    form.classList.add('hidden');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(form);
    var payload = {
      name: fd.get('name'), category: fd.get('category'),
      tags: fd.get('tags'), url: fd.get('url'), description: fd.get('description'),
      placement: fd.get('placement') || '',
      leftovers: fd.get('leftovers') === 'on',
      parentsOnly: fd.get('parentsOnly') === 'on',
      time: Number(fd.get('time')) || 0
    };
    // A meal saved with a newly added link and no recipe yet: open its card and
    // offer to read the page there, rather than leaving the link sitting unused.
    var priorUrl = editingId ? String((mealById(editingId) || {}).url || '').trim() : '';
    function offerImportCard(meal) {
      var url = String(meal.url || '').trim();
      if (!url || url === priorUrl) return;
      if (String(meal.ingredients || '').trim() || String(meal.steps || '').trim()) return;
      openMealCard(null, { mealId: meal.mealId, refresh: paint, autoImport: true });
    }

    if (editingId) {
      var id = editingId;
      call('updateMeal', id, payload).then(function (meal) {
        var idx = STATE.meals.findIndex(function (x) { return x.mealId === id; });
        if (idx !== -1) STATE.meals[idx] = meal;
        closeMealForm();
        toast('Meal updated'); paint();
        invalidateOverview(); // flags can change future auto-fills
        offerImportCard(meal);
      }).catch(function (err) { toast(errMsg(err), true); });
    } else {
      call('addMeal', payload).then(function (meal) {
        STATE.meals.push(meal);
        STATE.meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
        closeMealForm();
        toast('Meal added'); paint();
        offerImportCard(meal);
      }).catch(function (err) { toast(errMsg(err), true); });
    }
  });

  paintShelves();
  paint();
}

//// --- pointer drag engine + meal picker -------------------------------- ////

// A tiny mouse+touch drag: distinguishes a click from a drag by movement, shows
// a floating ghost, and reports the drop target under the pointer.
function pointerDrag(elm, opts) {
  elm.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('[data-nostart]')) return; // e.g. the chip's × button
    var sx = e.clientX, sy = e.clientY, dragging = false, ghost = null;

    // Elements marked data-touchgrip only drag from their ⠿ handle on touch —
    // a full-width row that dragged from anywhere would swallow the page's
    // scroll gesture. Touches elsewhere on the row: taps open it, moves scroll
    // natively (the row's touch-action allows pan-y).
    if (elm.hasAttribute('data-touchgrip') && e.pointerType !== 'mouse' &&
        !e.target.closest('[data-grip]')) {
      var upOnce = function (ev) {
        cleanupTap();
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6 && opts.onClick) opts.onClick(e);
      };
      var cancelOnce = function () { cleanupTap(); };
      var cleanupTap = function () {
        elm.removeEventListener('pointerup', upOnce);
        elm.removeEventListener('pointercancel', cancelOnce);
      };
      elm.addEventListener('pointerup', upOnce);
      elm.addEventListener('pointercancel', cancelOnce);
      return;
    }

    function onMove(ev) {
      if (!dragging) {
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 6) return;
        dragging = true;
        document.body.classList.add('dragging');
        ghost = el('div', { 'class': 'drag-ghost ' + opts.kind }, esc(opts.label()));
        document.body.appendChild(ghost);
      }
      ev.preventDefault();
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = ev.clientY + 'px';
      highlightDrop(opts.kind, ev.clientX, ev.clientY);
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (dragging) {
        document.body.classList.remove('dragging');
        if (ghost) ghost.remove();
        var target = dropTargetAt(opts.kind, ev.clientX, ev.clientY);
        clearDropHighlight();
        if (target != null) opts.onDrop(target);
      } else if (opts.onClick) {
        opts.onClick(e);
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function dropTargetAt(kind, x, y) {
  var elm = document.elementFromPoint(x, y);
  if (!elm) return null;
  if (kind === 'chip') {
    var z = elm.closest('.slotzone');
    return z ? { day: Number(z.getAttribute('data-day')), type: z.getAttribute('data-type') } : null;
  }
  if (kind === 'ovday') {
    var c = elm.closest('.day[data-week]');
    return c ? { week: c.getAttribute('data-week'), day: Number(c.getAttribute('data-day')) } : null;
  }
  var d = elm.closest('.wday');
  return d ? { day: Number(d.getAttribute('data-day')) } : null;
}

function highlightDrop(kind, x, y) {
  clearDropHighlight();
  var elm = document.elementFromPoint(x, y);
  if (!elm) return;
  var hit = kind === 'chip' ? elm.closest('.slotzone')
    : kind === 'ovday' ? elm.closest('.day[data-week]')
    : elm.closest('.wday');
  if (hit) hit.classList.add('drop-hi');
}
function clearDropHighlight() {
  qsa('.drop-hi').forEach(function (n) { n.classList.remove('drop-hi'); });
}

function dayDateLabel(weekStartIso, di) {
  var d = new Date(weekStartIso + 'T00:00:00');
  d.setDate(d.getDate() + di);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

// A floating popover to pick (or remove) the meal for one slot.
var _mpick = null;
function closeMealPicker() {
  if (!_mpick) return;
  document.removeEventListener('pointerdown', _mpick.outside, true);
  document.removeEventListener('keydown', _mpick.key, true);
  _mpick.pop.remove();
  _mpick = null;
}
function openMealPicker(anchor, currentId, onPick, opts) {
  closeMealPicker();
  var pop = el('div', { 'class': 'mpick' },
    '<input class="mpick-search" type="search" placeholder="Search or type a new meal…">' +
    '<div class="mpick-list"></div>' +
    (currentId ? '<button class="mpick-remove ghost danger">Remove meal</button>' : ''));
  document.body.appendChild(pop);
  positionPopover(pop, anchor);

  var searchEl = qs('.mpick-search', pop);
  var listEl = qs('.mpick-list', pop);
  // base mealId whose inline "add detail" input is open (opts.detailFor opens
  // the picker straight into "add a variation" mode for that base).
  var addingFor = (opts && opts.detailFor) || null;

  function hay(m) { return (m.name + ' ' + m.tags + ' ' + m.category).toLowerCase(); }
  function matches(m, q) { return !q || hay(m).indexOf(q) !== -1; }

  // Bases (and their variations) matching the query, plus a "create new" row
  // when the typed text isn't an existing meal name. Variations render indented
  // under their base; picking either assigns that meal's id.
  function paintList() {
    var raw = searchEl.value.trim();
    var q = raw.toLowerCase();
    listEl.innerHTML = '';

    if (raw) {
      var exists = STATE.meals.some(function (m) { return m.name.toLowerCase().trim() === q; });
      if (!exists) {
        listEl.appendChild(el('div', { 'class': 'mpick-create', 'data-create': '1' },
          '<span class="mpick-ic">＋</span>Create “<strong>' + esc(raw) + '</strong>”'));
      }
    }

    var bases = STATE.meals.filter(function (m) { return !m.parentId; });
    var shown = 0;
    bases.forEach(function (base) {
      var baseHit = matches(base, q);
      var kids = variationsOf(base.mealId).filter(function (k) { return baseHit || matches(k, q); });
      var open = addingFor === base.mealId;
      if (!baseHit && !kids.length && !open) return;
      shown++;

      listEl.appendChild(el('div',
        { 'class': 'mpick-item' + (base.mealId === currentId ? ' cur' : ''), 'data-id': esc(base.mealId) },
        '<span class="mpick-name">' + esc(base.name) + '</span>' +
        (base.category ? '<span class="mpick-cat">' + esc(base.category) + '</span>' : '') +
        '<button class="mpick-adddetail" data-adddetail="' + esc(base.mealId) + '" title="Add a variation">+ detail</button>'));

      kids.forEach(function (k) {
        listEl.appendChild(el('div',
          { 'class': 'mpick-item mpick-var' + (k.mealId === currentId ? ' cur' : ''), 'data-id': esc(k.mealId) },
          '<span class="mpick-name">' + esc(k.name) + '</span>'));
      });

      if (open) {
        listEl.appendChild(el('div', { 'class': 'mpick-detailrow' },
          '<input class="mpick-detail-input" type="text" placeholder="e.g. red curry, prawns">' +
          '<button type="button" class="primary mpick-detail-save" data-detailsave="' + esc(base.mealId) + '">Save</button>'));
      }
    });

    if (!shown && !raw) {
      listEl.appendChild(el('div', { 'class': 'muted', 'style': 'padding:.45rem .2rem' },
        'No meals yet — type a name to add one.'));
    }

    var di = qs('.mpick-detail-input', listEl);
    if (di) di.focus();
  }

  // Create a brand-new base meal from the typed text, then assign it.
  function createMeal(name) {
    name = String(name || '').trim();
    if (!name) return;
    call('addMeal', { name: name }).then(function (meal) {
      STATE.meals.push(meal);
      STATE.meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
      onPick(meal.mealId); closeMealPicker();
    }).catch(function (e) { toast(errMsg(e), true); });
  }

  // Save a variation under `parentId` and assign it.
  function saveVariation(parentId, detail) {
    detail = String(detail || '').trim();
    if (!detail) return;
    call('addVariation', parentId, detail).then(function (meal) {
      STATE.meals.push(meal);
      STATE.meals.sort(function (a, b) { return a.name.localeCompare(b.name); });
      onPick(meal.mealId); closeMealPicker();
    }).catch(function (e) { toast(errMsg(e), true); });
  }

  searchEl.addEventListener('input', paintList);
  searchEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var raw = searchEl.value.trim();
    if (!raw) return;
    var exact = STATE.meals.filter(function (m) {
      return m.name.toLowerCase().trim() === raw.toLowerCase();
    })[0];
    if (exact) { onPick(exact.mealId); closeMealPicker(); } else createMeal(raw);
  });
  pop.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var inp = e.target.closest('.mpick-detail-input');
    if (!inp) return;
    e.preventDefault();
    var btn = qs('[data-detailsave]', inp.parentNode);
    if (btn) saveVariation(btn.getAttribute('data-detailsave'), inp.value);
  });
  pop.addEventListener('click', function (e) {
    if (e.target.closest('.mpick-remove')) { onPick(null); closeMealPicker(); return; }
    if (e.target.closest('[data-create]')) { createMeal(searchEl.value); return; }
    var ad = e.target.closest('[data-adddetail]');
    if (ad) { addingFor = ad.getAttribute('data-adddetail'); paintList(); return; }
    var ds = e.target.closest('[data-detailsave]');
    if (ds) {
      var inp = qs('.mpick-detail-input', listEl);
      saveVariation(ds.getAttribute('data-detailsave'), inp ? inp.value : '');
      return;
    }
    var item = e.target.closest('[data-id]');
    if (item) { onPick(item.getAttribute('data-id')); closeMealPicker(); }
  });
  paintList();

  var outside = function (ev) { if (!pop.contains(ev.target)) closeMealPicker(); };
  var key = function (ev) { if (ev.key === 'Escape') closeMealPicker(); };
  _mpick = { pop: pop, outside: outside, key: key };
  setTimeout(function () {
    var di = qs('.mpick-detail-input', listEl);
    (di || searchEl).focus();
    document.addEventListener('pointerdown', outside, true);
    document.addEventListener('keydown', key, true);
  }, 0);
}
function positionPopover(pop, anchor) {
  // Some callers legitimately have nothing to anchor to (a popover opened from a
  // list row that has since been repainted). Centre it rather than throwing.
  if (!anchor || !anchor.getBoundingClientRect) {
    pop.style.left = Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px';
    pop.style.top = Math.max(8, (window.innerHeight - pop.offsetHeight) / 3) + 'px';
    return;
  }
  var r = anchor.getBoundingClientRect();
  var left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8));
  var top = r.bottom + 6;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

// The meal card: a full-height sheet, opened by tapping a planned meal. It
// replaced a small popover of text rows, which was the worst screen in the app —
// you couldn't tell what was tappable, and the one route to adding ingredients
// was hidden inside it (and only appeared once you already had some).
//
// It holds everything about that meal on that day: what you're having this week
// (the per-day picker), the ingredients it always needs, how to fill those in,
// and the day's actions.
//
// ctx = {
//   mealId,
//   day: { weekStart, dayIndex, slotType, role },   // omit when there's no day
//   onChange(anchor, opts), onSplit(anchor), onRemove(), refresh()
// }
var _card = null;
function closeMealCard() {
  if (!_card) return;
  document.removeEventListener('keydown', _card.key, true);
  _card.backdrop.remove();
  _card = null;
}
// Kept because the router and several callers still close "the slot menu".
function closeSlotMenu() { closeMealCard(); }

// Colour a choice group by what it is, so a chip's colour says which group it
// belongs to before you read the label. Anything unrecognised cycles the three.
var GROUP_TONES_ = ['style', 'protein', 'veg'];
function groupTone(name, index) {
  var n = String(name || '').toLowerCase();
  if (/protein|meat|fish/.test(n)) return 'protein';
  if (/veg|salad|side/.test(n)) return 'veg';
  if (/style|sauce|flavour|flavor|type/.test(n)) return 'style';
  return GROUP_TONES_[index % GROUP_TONES_.length];
}

function openMealCard(anchor, ctx) {
  closeMealCard();
  var mealId = ctx.mealId;
  var meal = mealId ? mealById(mealId) : null;
  if (!meal) return;
  var day = ctx.day || null;
  var base = meal.parentId ? mealById(meal.parentId) : meal;

  var dayLabel = day
    ? DOW[day.dayIndex] + ' ' + fmtWeek(shiftIso(day.weekStart, day.dayIndex))
    : 'In your menu';

  var backdrop = el('div', { 'class': 'sheet-backdrop' },
    '<div class="sheet" role="dialog" aria-modal="true">' +
      '<div class="sheet-head">' +
        '<div class="sheet-title">' +
          '<span class="sheet-day">' + esc(dayLabel) +
            (day && day.role ? ' &middot; ' + (day.role === 'adult' ? 'Adults' : 'Kids') : '') + '</span>' +
          '<h2 class="sheet-dish">' + esc(meal.name) + '</h2>' +
          timeBadge(meal.time, 'sheet-time') +
        '</div>' +
        '<button class="sheet-x ghost" data-act="close" aria-label="Close">' +
          '<svg class="i"><use href="#ic-x"/></svg></button>' +
      '</div>' +
      '<div class="sheet-body" data-bind="body"></div>' +
    '</div>');
  document.body.appendChild(backdrop);
  var body = bind(backdrop, 'body');

  // `chosen` is the set of option ids in effect for THIS day — an explicit pick
  // if there is one, else what was chosen last time, else the meal's defaults.
  var groups = [];
  var chosen = {};
  var linesOff = {};      // normalised always-line -> true when switched off
  var adding = null;      // groupId whose "add your own" input is open
  var editing = false;
  var status = '';
  var scanImages = [];
  var scanSeq = 0;

  function normLine(l) { return String(l || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

  function chipRow(group, gi) {
    return '<div class="pick-group tone-' + groupTone(group.name, gi) + '">' +
      '<div class="pick-label"><span class="pick-dot"></span>' + esc(group.name) +
        '<span class="muted"> &middot; pick ' + (group.pick === 'one' ? 'one' : 'any') + '</span></div>' +
      '<div class="pick-chips">' +
        group.options.map(function (o) {
          return '<button type="button" class="pick-chip' + (chosen[o.optionId] ? ' on' : '') +
            '" data-opt="' + esc(o.optionId) + '" data-gi="' + gi + '">' + esc(o.label) + '</button>';
        }).join('') +
        // No generated list of veg is ever exhaustive, so every group can be
        // extended in place rather than by editing raw text somewhere else.
        (adding === group.groupId
          ? '<input class="pick-add-in" data-bind="addIn" data-group="' + esc(group.groupId) + '" ' +
            'placeholder="Add&hellip;" autocomplete="off">'
          : '<button type="button" class="pick-chip add" data-addopt="' + esc(group.groupId) + '">' +
            '<svg class="i"><use href="#ic-plus"/></svg>Add</button>') +
      '</div></div>';
  }

  /**
   * Everything this day needs, in one list: the meal's always-lines plus the
   * lines every chosen option contributes. Option lines carry their group's
   * colour, so picking peppers visibly puts peppers in the list rather than just
   * lighting up a chip somewhere else.
   */
  function dayLines() {
    var out = [];
    String(meal.ingredients || '').split('\n').forEach(function (l) {
      var line = l.trim();
      if (line) out.push({ line: line, kind: 'always', off: !!linesOff[normLine(line)] });
    });
    groups.forEach(function (g, gi) {
      var tone = groupTone(g.name, gi);
      g.options.forEach(function (o) {
        if (!chosen[o.optionId]) return;
        String(o.ingredients || '').split('\n').forEach(function (l) {
          var line = l.trim();
          if (line) out.push({ line: line, kind: 'option', optionId: o.optionId, tone: tone });
        });
      });
    });
    return out;
  }

  function lineList() {
    var items = dayLines();
    if (!items.length) return '';
    return '<ul class="ing-lines">' + items.map(function (it) {
      var attr = it.kind === 'always'
        ? 'data-line="' + esc(it.line) + '"'
        : 'data-optline="' + esc(it.optionId) + '"';
      return '<li><button type="button" class="ing-line' + (it.off ? ' off' : '') +
        (it.kind === 'option' ? ' from-pick tone-' + it.tone : '') + '" ' + attr + '>' +
        '<span class="ing-tick">' + (it.off ? '' : '<svg class="i"><use href="#ic-check"/></svg>') + '</span>' +
        '<span>' + esc(it.line) + '</span></button></li>';
    }).join('') + '</ul>';
  }

  function render() {
    var hasLines = !!String(meal.ingredients || '').trim();
    var html = '';

    if (groups.length) {
      html += '<section class="sheet-sec">' +
        '<h3 class="sheet-h">' + (day ? 'This week you&rsquo;re having' : 'Varies week to week') + '</h3>' +
        '<p class="sheet-note">' + (day
          ? 'Changing these affects ' + esc(DOW[day.dayIndex]) + ' only &mdash; and this week&rsquo;s shopping list.'
          : 'Highlighted options are the usual ones.') + '</p>' +
        groups.map(chipRow).join('') +
      '</section>';
    }

    html += '<section class="sheet-sec">' +
      '<div class="sheet-h-row">' +
        '<h3 class="sheet-h">' + (day ? 'Shopping for ' + esc(DOW[day.dayIndex]) : 'Ingredients') + '</h3>' +
        (hasLines ? '<button class="linky" data-act="edit">' + (editing ? 'Done' : 'Edit') + '</button>' : '') +
      '</div>' +
      (day && hasLines && !editing
        ? '<p class="sheet-note">Tap anything you already have to leave it off this week&rsquo;s list.</p>'
        : '');

    if (editing || !hasLines) {
      if (!hasLines) {
        html += '<p class="sheet-note">Nothing saved yet, so this meal adds nothing to the shopping list. ' +
          'Type it in, or use one of the buttons below.</p>';
      }
      html += '<textarea class="md-field" rows="6" data-bind="ingredients" placeholder="One ingredient per line&hellip;"></textarea>' +
        '<label>Method</label>' +
        '<textarea class="md-field" rows="5" data-bind="steps" placeholder="1. First step&hellip;"></textarea>' +
        '<label>Recipe URL</label>' +
        '<input type="url" data-bind="url" placeholder="https://&hellip;">' +
        '<div class="row" style="margin-top:.7rem"><button class="primary" data-act="save">Save</button></div>';
    } else {
      html += lineList();
      if (String(meal.steps || '').trim()) {
        html += '<details class="method"><summary>Method</summary>' +
          '<div class="method-body">' + esc(meal.steps).replace(/\n/g, '<br>') + '</div></details>';
      }
    }
    html += '</section>';

    html += '<section class="sheet-sec">' +
      '<h3 class="sheet-h">' + (hasLines ? 'Replace it with' : 'Fill it in') + '</h3>' +
      '<div class="fill-row">' +
        '<button data-act="camera"><svg class="i"><use href="#ic-cam"/></svg>Photo</button>' +
        '<button data-act="library"><svg class="i"><use href="#ic-image"/></svg>Gallery</button>' +
        '<button data-act="fromUrl"><svg class="i"><use href="#ic-link"/></svg>URL</button>' +
        (STATE.hasAi ? '<button data-act="generate"><svg class="i"><use href="#ic-spark"/></svg>Draft</button>' : '') +
      '</div>' +
      (status ? '<p class="sheet-note">' + esc(status) + '</p>' : '') +
      '<div class="scan-pages hidden" data-bind="pages"></div>' +
      '<input type="file" accept="image/*" capture="environment" multiple class="hidden" data-bind="camIn">' +
      '<input type="file" accept="image/*" multiple class="hidden" data-bind="libIn">' +
    '</section>';

    if (day) {
      html += '<section class="sheet-sec sheet-acts">' +
        '<button data-act="change"><svg class="i"><use href="#ic-swap"/></svg>Change meal</button>' +
        (base ? '<button data-act="adddetail"><svg class="i"><use href="#ic-plus"/></svg>Add detail</button>' : '') +
        (ctx.onSplit ? '<button data-act="split"><svg class="i"><use href="#ic-split"/></svg>Split day</button>' : '') +
        '<button class="danger" data-act="remove"><svg class="i"><use href="#ic-trash"/></svg>Remove</button>' +
      '</section>';
    }

    body.innerHTML = html;
    if (editing || !hasLines) {
      bind(backdrop, 'ingredients').value = meal.ingredients || '';
      bind(backdrop, 'steps').value = meal.steps || '';
      bind(backdrop, 'url').value = meal.url || '';
    }
    var addIn = bind(backdrop, 'addIn');
    if (addIn) {
      addIn.focus();
      addIn.onkeydown = function (ev) {
        if (ev.key === 'Escape') { adding = null; render(); return; }
        if (ev.key !== 'Enter') return;
        commitAddOption(addIn.getAttribute('data-group'), addIn.value);
      };
      addIn.onblur = function () { if (!addIn.value.trim()) { adding = null; render(); } };
    }
    wireScan();
  }

  // Add an option to a group and switch it on straight away — you're adding it
  // because you want it tonight, not to populate a list for later.
  function commitAddOption(groupId, label) {
    var text = String(label || '').trim();
    if (!text) { adding = null; render(); return; }
    adding = null;
    call('addChoiceOption', mealId, groupId, text, '').then(function (res) {
      groups = res.groups || groups;
      var group = groups.filter(function (g) { return g.groupId === groupId; })[0];
      if (group && group.pick === 'one') {
        group.options.forEach(function (o) { delete chosen[o.optionId]; });
      }
      chosen[res.optionId] = true;
      render();
      saveChoices();
    }).catch(function (err) { toast(errMsg(err), true); render(); });
  }

  function setStatus(text) { status = text; render(); }

  function loadChoices() {
    if (day) {
      return call('getResolvedSlotChoices', day.weekStart, day.dayIndex, day.slotType, mealId, day.role || '')
        .then(function (res) {
          groups = res.groups || [];
          chosen = {};
          (res.chosen || []).forEach(function (id) { chosen[id] = true; });
          linesOff = {};
          (res.linesOff || []).forEach(function (l) { linesOff[normLine(l)] = true; });
        });
    }
    return call('getMealChoices', mealId).then(function (saved) {
      groups = saved || [];
      chosenFromDefaults();
    });
  }

  function chosenFromDefaults() {
    chosen = {};
    groups.forEach(function (g) {
      g.options.forEach(function (o) { if (o.defaultOn) chosen[o.optionId] = true; });
    });
  }

  function saveChoices() {
    var ids = Object.keys(chosen).filter(function (id) { return chosen[id]; });
    if (day) {
      return callQuiet('setSlotChoices', day.weekStart, day.dayIndex, day.slotType, mealId, day.role || '', ids)
        .catch(function (err) { toast(errMsg(err), true); });
    }
    // No day: the chips are setting the meal's usual options instead.
    groups.forEach(function (g) {
      g.options.forEach(function (o) { o.defaultOn = !!chosen[o.optionId]; });
    });
    return callQuiet('saveMealChoices', mealId, groups)
      .catch(function (err) { toast(errMsg(err), true); });
  }

  function wireScan() {
    var camIn = bind(backdrop, 'camIn');
    var libIn = bind(backdrop, 'libIn');
    if (!camIn) return;
    camIn.onchange = function () { addPhotos(camIn.files); camIn.value = ''; };
    libIn.onchange = function () { addPhotos(libIn.files); libIn.value = ''; };
    var pagesEl = bind(backdrop, 'pages');
    pagesEl.innerHTML = scanImages.map(function (img, i) {
      return '<div class="scan-page"><img src="data:' + img.mediaType + ';base64,' + img.data +
        '" alt="Page ' + (i + 1) + '"><span class="scan-page-n">' + (i + 1) + '</span></div>';
    }).join('');
    pagesEl.classList.toggle('hidden', !scanImages.length);
  }

  function addPhotos(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    setStatus('Reading ' + files.length + ' photo' + (files.length === 1 ? '' : 's') + '…');
    Promise.all(files.map(fileToImagePayload)).then(function (payloads) {
      scanImages = scanImages.concat(payloads);
      var my = ++scanSeq;
      var n = scanImages.length;
      setStatus('Transcribing ' + n + ' page' + (n === 1 ? '' : 's') + ' with AI…');
      return call('transcribeRecipePhoto', scanImages).then(function (res) {
        if (my !== scanSeq) return;
        if (!res.ingredients && !res.steps) { setStatus(''); toast('Couldn’t read a recipe from those photos.', true); return; }
        applyScanned(res, 'Read ' + n + ' page' + (n === 1 ? '' : 's') + ' — check it over.');
      });
    }).catch(function (err) { setStatus(''); toast(errMsg(err), true); });
  }

  function importFromUrl(url) {
    setStatus('Reading that page…');
    call('importRecipeFromUrl', url).then(function (res) {
      if (!res.ingredients && !res.steps) { setStatus(''); toast('No recipe found on that page.', true); return; }
      applyScanned(res, 'Read from the page — check it over.');
    }).catch(function (err) { setStatus(''); toast(errMsg(err), true); });
  }

  // A meal that just gained a link but still has no recipe almost certainly
  // wants that link read — offer it, with the URL shown so a paste of the
  // wrong page gets caught before the import runs, not after.
  function offerImport() {
    var url = String(meal.url || '').trim();
    if (!url) return;
    if (String(meal.ingredients || '').trim() || String(meal.steps || '').trim()) return;
    if (!window.confirm('Read ingredients and method from this page?\n\n' + url)) return;
    importFromUrl(url);
  }

  /**
   * A scanned or fetched recipe is a FIXED list — that recipe wants those exact
   * vegetables. If the meal also has choice groups offering vegetables, keeping
   * both buys some things twice. It's genuinely ambiguous which the person
   * wants, so ask rather than silently double-buying or silently deleting work.
   */
  function applyScanned(res, note) {
    if (!groups.length) { applyRecipe(res, note); return; }
    var names = groups.map(function (g) { return g.name; }).join(', ');
    var replace = window.confirm(
      'This meal has choices set up (' + names + '), and the recipe you just read ' +
      'brings its own ingredients.\n\n' +
      'OK — use the recipe on its own and remove the choices.\n' +
      'Cancel — keep the choices as well (you may end up buying some things twice).');
    applyRecipe(res, note, replace ? [] : null);
  }

  // Persist whatever a scan / URL / draft produced straight away, so the card
  // never shows a recipe the shopping list hasn't been told about.
  // newGroups: an array replaces the meal's choice groups (empty clears them);
  // null or undefined leaves whatever is already saved untouched.
  function applyRecipe(res, note, newGroups) {
    meal.ingredients = res.ingredients || meal.ingredients;
    if (res.steps) meal.steps = res.steps;
    if (res.timeMins) meal.time = res.timeMins;
    var patch = { ingredients: meal.ingredients, steps: meal.steps, url: meal.url || '' };
    if (res.timeMins) patch.time = res.timeMins;
    call('saveRecipe', mealId, patch, newGroups || null).then(function (saved) {
      syncMeal(saved.meal);
      if (newGroups) {
        groups = saved.groups || [];
        chosenFromDefaults();
        if (day) saveChoices();
      }
      editing = false;
      setStatus(note);
      if (ctx.refresh) ctx.refresh();
    }).catch(function (err) { setStatus(''); toast(errMsg(err), true); });
  }

  function syncMeal(updated) {
    meal.ingredients = updated.ingredients;
    meal.steps = updated.steps;
    meal.url = updated.url;
    meal.time = updated.time;
    var cached = mealById(mealId);
    if (cached) {
      cached.ingredients = updated.ingredients;
      cached.steps = updated.steps;
      cached.url = updated.url;
      cached.time = updated.time;
    }
  }

  backdrop.addEventListener('click', function (e) {
    if (e.target === backdrop) { closeMealCard(); return; }

    var chip = e.target.closest('[data-opt]');
    if (chip) {
      var optId = chip.getAttribute('data-opt');
      var group = groups[Number(chip.getAttribute('data-gi'))];
      if (group.pick === 'one') {
        var turningOn = !chosen[optId];
        group.options.forEach(function (o) { delete chosen[o.optionId]; });
        if (turningOn) chosen[optId] = true;
      } else if (chosen[optId]) {
        delete chosen[optId];
      } else {
        chosen[optId] = true;
      }
      render();
      saveChoices();
      refreshLiveList();
      return;
    }

    var addBtn = e.target.closest('[data-addopt]');
    if (addBtn) { adding = addBtn.getAttribute('data-addopt'); render(); return; }

    // Tapping an always-line switches it off for this day only.
    var lineBtn = e.target.closest('[data-line]');
    if (lineBtn) {
      if (!day) { toast('Open this meal from a planned day to leave things off.'); return; }
      var text = lineBtn.getAttribute('data-line');
      var key = normLine(text);
      var nowOff = !linesOff[key];
      if (nowOff) linesOff[key] = true; else delete linesOff[key];
      render();
      callQuiet('setSlotLineOff', day.weekStart, day.dayIndex, day.slotType, mealId,
        day.role || '', text, nowOff)
        .then(refreshLiveList)
        .catch(function (err) { toast(errMsg(err), true); });
      return;
    }

    // Tapping a line that came from a choice just deselects that choice — two
    // controls for the same thing would be one too many.
    var optLine = e.target.closest('[data-optline]');
    if (optLine) {
      delete chosen[optLine.getAttribute('data-optline')];
      render();
      saveChoices();
      refreshLiveList();
      return;
    }

    var hit = e.target.closest('[data-act]');
    var act = hit && hit.getAttribute('data-act');
    if (!act) return;

    if (act === 'close') { closeMealCard(); return; }
    if (act === 'edit') { editing = !editing; render(); return; }
    if (act === 'camera') { bind(backdrop, 'camIn').click(); return; }
    if (act === 'library') { bind(backdrop, 'libIn').click(); return; }

    if (act === 'save') {
      var patch = {
        ingredients: bind(backdrop, 'ingredients').value.trim(),
        steps: bind(backdrop, 'steps').value.trim(),
        url: bind(backdrop, 'url').value.trim()
      };
      var urlIsNew = patch.url && patch.url !== String(meal.url || '').trim();
      call('saveRecipe', mealId, patch, null).then(function (saved) {
        syncMeal(saved.meal);
        editing = false;
        setStatus('');
        toast('Saved');
        if (ctx.refresh) ctx.refresh();
        if (urlIsNew) offerImport();
      }).catch(function (err) { toast(errMsg(err), true); });
      return;
    }

    if (act === 'fromUrl') {
      var url = String(meal.url || '').trim();
      if (!url) {
        url = String(window.prompt('Recipe URL to read from:', '') || '').trim();
        if (!url) return;
        meal.url = url;
      }
      importFromUrl(url);
      return;
    }

    if (act === 'generate') {
      if (String(meal.ingredients || '').trim() &&
          !window.confirm('Replace this recipe with an AI draft?')) return;
      setStatus('Drafting “' + meal.name + '”…');
      call('generateRecipeForMeal', mealId).then(function (res) {
        applyRecipe(res, 'Draft ready — check it over.', res.groups || []);
      }).catch(function (err) { setStatus(''); toast(errMsg(err), true); });
      return;
    }

    // Day actions all replace or remove this meal, so the card closes first —
    // leaving it open behind them would be showing a day that no longer exists.
    if (act === 'change') { closeMealCard(); return ctx.onChange(anchor); }
    if (act === 'adddetail') { closeMealCard(); return ctx.onChange(anchor, { detailFor: base.mealId }); }
    if (act === 'split') { closeMealCard(); return ctx.onSplit(anchor); }
    if (act === 'remove') { closeMealCard(); return ctx.onRemove(); }
  });

  var key = function (ev) { if (ev.key === 'Escape') closeMealCard(); };
  _card = { backdrop: backdrop, key: key, mealId: mealId };
  setTimeout(function () { document.addEventListener('keydown', key, true); }, 0);

  render();
  loadChoices().then(function () {
    render();
    if (ctx.autoImport) offerImport();
  }).catch(function () { render(); });
}


// A tiny popover to set / edit / remove a meal's recipe URL, anchored to the
// + (or ✎) control on a menu tile. Calls onSave with the trimmed URL ('' clears).
var _uedit = null;
function closeUrlEditor() {
  if (!_uedit) return;
  document.removeEventListener('pointerdown', _uedit.outside, true);
  document.removeEventListener('keydown', _uedit.key, true);
  _uedit.pop.remove();
  _uedit = null;
}
function openUrlEditor(anchor, current, onSave) {
  closeUrlEditor();
  var pop = el('div', { 'class': 'mpick uedit' },
    '<input class="uedit-input" type="url" placeholder="https://…" value="' + esc(current) + '">' +
    '<div class="row" style="gap:.4rem">' +
      '<button type="button" class="primary uedit-save">Save</button>' +
      (current ? '<button type="button" class="ghost danger uedit-remove">Remove</button>' : '') +
    '</div>');
  document.body.appendChild(pop);
  positionPopover(pop, anchor);

  var input = qs('.uedit-input', pop);
  function save(val) { onSave(String(val || '').trim()); closeUrlEditor(); }
  pop.addEventListener('click', function (e) {
    if (e.target.closest('.uedit-save')) save(input.value);
    else if (e.target.closest('.uedit-remove')) save('');
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); save(input.value); }
  });

  var outside = function (ev) { if (!pop.contains(ev.target)) closeUrlEditor(); };
  var key = function (ev) { if (ev.key === 'Escape') closeUrlEditor(); };
  _uedit = { pop: pop, outside: outside, key: key };
  setTimeout(function () {
    input.focus(); input.select();
    document.addEventListener('pointerdown', outside, true);
    document.addEventListener('keydown', key, true);
  }, 0);
}

// Downscale a chosen photo in the browser before upload: caps the long edge at
// 1568px (plenty for vision, much smaller payload) and re-encodes as JPEG.
// Resolves to { data, mediaType } where data is base64 with no data: prefix.
function fileToImagePayload(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Could not read the photo.')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('That file is not a readable image.')); };
      img.onload = function () {
        var maxEdge = 1568;
        var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = el('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ data: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
